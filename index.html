<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfect Smile Vorschau</title>
<meta name="description" content="Vorschau des Labormanagement-Systems Perfect Smile mit erfundenen Daten">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#075985">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Perfect Smile">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="index.webmanifest">
<style>
/* Perfect Smile · Vorschau-Apps
   Layout: eine App-Schale je Gerät (Handy: Kopf, Inhalt, Tableiste; iPad: Kopf, Inhalt; Display: Vollbild-Raster).
   Farben folgen der echten Anwendung (sky-800 als Akzent, kühle Schiefer-Neutraltöne), Schrift ist die Systemschrift
   des Geräts (SF Pro auf iPhone/iPad, Roboto auf Android), damit es sich wie eine native App anfühlt und offline läuft.
   NFR-09: Mindestschrift 16 px, Kontrast nach WCAG AA. LST-01: Schaltflächen mindestens 44 × 44 Punkt. */

:root {
  --bg: #eef2f6;
  --flaeche: #ffffff;
  --flaeche-2: #f6f8fb;
  --tinte: #0e1a27;
  --leise: #47586b;
  --linie: #d3dce6;
  --akzent: #075985;
  --akzent-tief: #054468;
  --akzent-tinte: #ffffff;
  --akzent-weich: #e1f0f9;
  --rot: #b42318;
  --rot-weich: #fde8e5;
  --gelb: #7a4d00;
  --gelb-weich: #fff1c2;
  --gelb-rand: #e8b931;
  --gruen: #12693f;
  --gruen-weich: #ddf3e6;
  --violett: #5b3aa8;
  --violett-weich: #ece6fa;
  --tuerkis: #0b6461;
  --tuerkis-weich: #d9f1ef;
  --grau-weich: #e8edf2;
  --schatten: 0 1px 2px rgb(14 26 39 / 6%), 0 4px 14px rgb(14 26 39 / 7%);
  --schatten-hoch: 0 10px 40px rgb(14 26 39 / 22%);
  --schrift:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial,
    sans-serif;
  --schrift-titel:
    -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI",
    Roboto, sans-serif;
  --radius: 14px;
  --radius-klein: 10px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1219;
    --flaeche: #131d28;
    --flaeche-2: #18242f;
    --tinte: #e9eff5;
    --leise: #a3b3c4;
    --linie: #2a3a4c;
    --akzent: #5db7e8;
    --akzent-tief: #8ccdf0;
    --akzent-tinte: #03233a;
    --akzent-weich: #12324a;
    --rot: #ff8a7f;
    --rot-weich: #3d1a18;
    --gelb: #ffd166;
    --gelb-weich: #3a2e0c;
    --gelb-rand: #b88b1c;
    --gruen: #6fd6a0;
    --gruen-weich: #12341f;
    --violett: #c3aefc;
    --violett-weich: #2a2145;
    --tuerkis: #6fd8d2;
    --tuerkis-weich: #0f3432;
    --grau-weich: #223140;
    --schatten: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
    --schatten-hoch: 0 10px 40px rgb(0 0 0 / 55%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1219;
  --flaeche: #131d28;
  --flaeche-2: #18242f;
  --tinte: #e9eff5;
  --leise: #a3b3c4;
  --linie: #2a3a4c;
  --akzent: #5db7e8;
  --akzent-tief: #8ccdf0;
  --akzent-tinte: #03233a;
  --akzent-weich: #12324a;
  --rot: #ff8a7f;
  --rot-weich: #3d1a18;
  --gelb: #ffd166;
  --gelb-weich: #3a2e0c;
  --gelb-rand: #b88b1c;
  --gruen: #6fd6a0;
  --gruen-weich: #12341f;
  --violett: #c3aefc;
  --violett-weich: #2a2145;
  --tuerkis: #6fd8d2;
  --tuerkis-weich: #0f3432;
  --grau-weich: #223140;
  --schatten: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
  --schatten-hoch: 0 10px 40px rgb(0 0 0 / 55%);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tinte);
  font-family: var(--schrift);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
[hidden] {
  display: none !important;
}
svg {
  width: 1.25em;
  height: 1.25em;
  flex-shrink: 0;
}
.eintrag > svg:last-child {
  color: var(--leise);
  width: 22px;
  height: 22px;
}
.stopp-nr svg {
  width: 22px;
  height: 22px;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
a {
  color: var(--akzent);
}
:focus-visible {
  outline: 3px solid var(--akzent);
  outline-offset: 2px;
  border-radius: 6px;
}
h1,
h2,
h3 {
  font-family: var(--schrift-titel);
  text-wrap: balance;
  margin: 0;
  letter-spacing: -0.01em;
}
p {
  margin: 0;
}
.zahl,
.nr {
  font-variant-numeric: tabular-nums;
}
.leise {
  color: var(--leise);
}
.fett {
  font-weight: 650;
}
.klein {
  font-size: 0.9375rem;
} /* 15 px nur für Zusatzangaben neben 16-px-Text; Fließtext bleibt 16 px */
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- App-Schale ---------- */
#app {
  height: 100%;
}
.schale {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  background: var(--bg);
  position: relative;
}
.kopf {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
    10px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--flaeche) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--linie);
  min-height: 56px;
}
.kopf h1 {
  font-size: 1.25rem;
  font-weight: 700;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.kopf .unter {
  display: block;
  font-family: var(--schrift);
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--leise);
  letter-spacing: 0;
}
.inhalt {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px
    max(16px, env(safe-area-inset-left, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.inhalt > * {
  flex-shrink: 0;
}
.tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: color-mix(in srgb, var(--flaeche) 92%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--linie);
  padding: 6px max(8px, env(safe-area-inset-right, 0px))
    calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 52px;
  border: 0;
  background: none;
  color: var(--leise);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  border-radius: 12px;
  position: relative;
}
.tab svg {
  width: 26px;
  height: 26px;
}
.tab[aria-current="page"] {
  color: var(--akzent);
}
.tab .punkt {
  position: absolute;
  top: 4px;
  left: calc(50% + 8px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--rot);
  color: #fff;
  font-size: 0.75rem;
  line-height: 18px;
}

/* Handy auf großem Bildschirm: im Geräterahmen zeigen */
@media (min-width: 760px) {
  body.mit-rahmen {
    display: grid;
    place-items: center;
    padding: 24px;
  }
  body.mit-rahmen #app {
    width: 410px;
    height: min(880px, calc(100vh - 48px));
    border-radius: 44px;
    overflow: hidden;
    box-shadow:
      0 0 0 10px #10171f,
      0 0 0 11px #3a4653,
      var(--schatten-hoch);
    position: relative;
  }
  body.mit-rahmen .schale {
    border-radius: 44px;
  }
}

/* ---------- Bausteine ---------- */
.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  box-shadow: var(--schatten);
}
.karte.innen {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.abschnitt {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.abschnitt > h2,
.ueberschrift {
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--leise);
  font-weight: 700;
  font-family: var(--schrift);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.abschnitt > h2 a,
.abschnitt > h2 button {
  text-transform: none;
  letter-spacing: 0;
  font-size: 0.9375rem;
}
.zeile {
  display: flex;
  align-items: center;
  gap: 12px;
}
.zeile.oben {
  align-items: flex-start;
}
.wachse {
  flex: 1;
  min-width: 0;
}
.stapel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.abstand-8 {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.umbruch {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.knopf {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-weight: 650;
  font-size: 1rem;
  background: var(--akzent);
  color: var(--akzent-tinte);
  transition:
    transform 0.08s ease,
    filter 0.15s ease;
  text-decoration: none;
  user-select: none;
  -webkit-user-select: none;
}
.knopf:active {
  transform: scale(0.98);
  filter: brightness(0.94);
}
.knopf[disabled],
.knopf[aria-disabled="true"] {
  opacity: 0.45;
  pointer-events: none;
}
.knopf.voll {
  width: 100%;
}
.knopf.gross {
  min-height: 58px;
  font-size: 1.125rem;
  border-radius: 14px;
}
.knopf.zweit {
  background: var(--flaeche);
  color: var(--akzent);
  border-color: var(--linie);
}
.knopf.weich {
  background: var(--akzent-weich);
  color: var(--akzent-tief);
}
.knopf.gefahr {
  background: var(--rot);
  color: #fff;
}
.knopf.gruen {
  background: var(--gruen);
  color: #fff;
}
:root[data-theme="dark"] .knopf.gruen {
  color: #04210f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .knopf.gruen {
    color: #04210f;
  }
  :root:not([data-theme="light"]) .knopf.gefahr {
    color: #2a0906;
  }
}
:root[data-theme="dark"] .knopf.gefahr {
  color: #2a0906;
}
.knopf.text {
  background: none;
  color: var(--akzent);
  padding-inline: 8px;
  min-height: 44px;
}
.knopf svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.icon-knopf {
  width: 44px;
  height: 44px;
  display: inline-grid;
  place-items: center;
  border-radius: 12px;
  border: 0;
  background: none;
  color: var(--tinte);
  position: relative;
  flex-shrink: 0;
}
.icon-knopf svg {
  width: 26px;
  height: 26px;
}
.icon-knopf .punkt {
  position: absolute;
  top: 4px;
  right: 4px;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  background: var(--rot);
  color: #fff;
  font-size: 0.75rem;
  line-height: 18px;
  padding: 0 5px;
  font-weight: 700;
}

.pille {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 650;
  white-space: nowrap;
  background: var(--grau-weich);
  color: var(--tinte);
  line-height: 1.4;
}
.pille::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}
.pille.ohne-punkt::before {
  display: none;
}
.st-angenommen {
  background: var(--grau-weich);
  color: var(--tinte);
}
.st-zugewiesen {
  background: var(--akzent-weich);
  color: var(--akzent-tief);
}
.st-in_fertigung {
  background: #dbeafe;
  color: #1e3a8a;
}
.st-qualitaetskontrolle {
  background: var(--violett-weich);
  color: var(--violett);
}
.st-versandbereit {
  background: var(--tuerkis-weich);
  color: var(--tuerkis);
}
.st-ausgeliefert {
  background: var(--gruen-weich);
  color: var(--gruen);
}
.st-abgerechnet {
  background: var(--grau-weich);
  color: var(--leise);
}
.st-rueckfrage {
  background: var(--gelb-weich);
  color: var(--gelb);
}
.st-storniert {
  background: var(--grau-weich);
  color: var(--leise);
  text-decoration: line-through;
}
:root[data-theme="dark"] .st-in_fertigung {
  background: #172a4d;
  color: #a9c8ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .st-in_fertigung {
    background: #172a4d;
    color: #a9c8ff;
  }
}
.z-offen {
  background: var(--akzent-weich);
  color: var(--akzent-tief);
}
.z-bezahlt {
  background: var(--gruen-weich);
  color: var(--gruen);
}
.z-teilweise {
  background: var(--gelb-weich);
  color: var(--gelb);
}
.z-ueberfaellig {
  background: var(--rot-weich);
  color: var(--rot);
}
.z-entwurf {
  background: var(--grau-weich);
  color: var(--leise);
}

/* Terminampel (AUF-08): rot = überfällig, gelb = heute fällig */
.ampel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.ampel.rot {
  color: var(--rot);
}
.ampel.gelb {
  color: var(--gelb);
}
.ampel.rot::before,
.ampel.gelb::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: currentColor;
}
.streifen {
  position: relative;
  overflow: hidden;
}
.streifen.rot {
  box-shadow:
    inset 5px 0 0 var(--rot),
    var(--schatten);
}
.streifen.gelb {
  box-shadow:
    inset 5px 0 0 var(--gelb-rand),
    var(--schatten);
}

.liste {
  display: flex;
  flex-direction: column;
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  box-shadow: var(--schatten);
  overflow: hidden;
}
.liste > .eintrag {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  min-height: 60px;
  border: 0;
  border-top: 1px solid var(--linie);
  background: none;
  text-align: left;
  width: 100%;
}
.liste > .eintrag:first-child {
  border-top: 0;
}
.liste > button.eintrag:active,
.liste > a.eintrag:active {
  background: var(--flaeche-2);
}
.liste > a.eintrag {
  color: inherit;
  text-decoration: none;
}
.pfeil {
  color: var(--leise);
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}

.feld {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.feld label,
.feld .label {
  font-weight: 600;
  font-size: 0.9375rem;
}
.eingabe {
  min-height: 50px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  width: 100%;
  font-size: 1rem;
}
textarea.eingabe {
  min-height: 96px;
  resize: vertical;
}
.eingabe:focus {
  outline: 3px solid color-mix(in srgb, var(--akzent) 45%, transparent);
  border-color: var(--akzent);
}
.fehler {
  background: var(--rot-weich);
  color: var(--rot);
  border-radius: 10px;
  padding: 10px 12px;
  font-weight: 600;
}
.hinweis {
  background: var(--akzent-weich);
  color: var(--akzent-tief);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.hinweis.gelb {
  background: var(--gelb-weich);
  color: var(--gelb);
}
.hinweis.gruen {
  background: var(--gruen-weich);
  color: var(--gruen);
}
.hinweis.rot {
  background: var(--rot-weich);
  color: var(--rot);
}
.hinweis svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  margin-top: 1px;
}

.segment {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: var(--grau-weich);
  border-radius: 12px;
  padding: 3px;
  gap: 3px;
}
.segment button {
  min-height: 42px;
  border: 0;
  border-radius: 9px;
  background: none;
  font-weight: 600;
  color: var(--leise);
  font-size: 0.9375rem;
}
.segment button[aria-pressed="true"] {
  background: var(--flaeche);
  color: var(--tinte);
  box-shadow: var(--schatten);
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
  margin: -2px;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  flex-shrink: 0;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  font-weight: 600;
  font-size: 0.9375rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip[aria-pressed="true"] {
  background: var(--tinte);
  color: var(--bg);
  border-color: var(--tinte);
}
.chip .anz {
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
}

.leer {
  text-align: center;
  color: var(--leise);
  padding: 28px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.leer svg {
  width: 44px;
  height: 44px;
  opacity: 0.6;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--schrift-titel);
  font-weight: 750;
  letter-spacing: -0.02em;
}
.logo-zeichen {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--akzent);
  color: var(--akzent-tinte);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.logo-zeichen svg {
  width: 24px;
  height: 24px;
}
.demo-band {
  font-size: 0.8125rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gelb);
  background: var(--gelb-weich);
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
}

/* Kennzahl-Kacheln (DSH-01) */
.kacheln {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.kachel {
  text-align: left;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: var(--schatten);
  min-height: 104px;
}
.kachel .wert {
  font-family: var(--schrift-titel);
  font-size: 2.25rem;
  font-weight: 750;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.kachel .was {
  font-weight: 600;
}
.kachel.rot .wert {
  color: var(--rot);
}
.kachel.gelb .wert {
  color: var(--gelb);
}
.kachel:active {
  transform: scale(0.985);
}

/* Ebene für Blätter und Meldungen */
#ebene {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.blatt-hg {
  position: absolute;
  inset: 0;
  background: rgb(5 12 20 / 45%);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.blatt {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  background: var(--flaeche);
  border-radius: 22px 22px 0 0;
  box-shadow: var(--schatten-hoch);
  padding: 10px max(20px, env(safe-area-inset-right, 0px))
    calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(100%);
  transition: transform 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#ebene.offen .blatt-hg {
  opacity: 1;
}
#ebene.offen .blatt {
  transform: none;
}
.blatt-griff {
  width: 40px;
  height: 5px;
  border-radius: 3px;
  background: var(--linie);
  align-self: center;
  flex-shrink: 0;
}
.blatt h2 {
  font-size: 1.375rem;
}
.blatt .knoepfe {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
@media (min-width: 760px) {
  #ebene {
    align-items: center;
  }
  .blatt {
    border-radius: 22px;
    max-height: calc(100% - 64px);
    transform: translateY(24px) scale(0.98);
    opacity: 0;
    transition:
      transform 0.22s ease,
      opacity 0.18s ease;
  }
  #ebene.offen .blatt {
    opacity: 1;
  }
  .blatt-griff {
    display: none;
  }
  .blatt .knoepfe {
    flex-direction: row-reverse;
  }
  .blatt .knoepfe .knopf {
    flex: 1;
  }
}
#meldungen {
  position: fixed;
  left: 0;
  right: 0;
  top: calc(12px + env(safe-area-inset-top, 0px));
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  padding-inline: 16px;
}
.meldung {
  pointer-events: auto;
  max-width: 520px;
  background: var(--tinte);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: 14px;
  box-shadow: var(--schatten-hoch);
  font-weight: 600;
  display: flex;
  gap: 10px;
  align-items: center;
  animation: rein 0.25s ease both;
}
.meldung svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.meldung.weg {
  animation: raus 0.25s ease both;
}
@keyframes rein {
  from {
    opacity: 0;
    transform: translateY(-12px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes raus {
  to {
    opacity: 0;
    transform: translateY(-12px);
  }
}

.fortschritt {
  height: 8px;
  border-radius: 4px;
  background: var(--grau-weich);
  overflow: hidden;
}
.fortschritt > i {
  display: block;
  height: 100%;
  background: var(--gruen);
  border-radius: 4px;
  transition: width 0.4s ease;
}

.info-raster {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 8px 16px;
}
.info-raster dt {
  color: var(--leise);
}
.info-raster dd {
  margin: 0;
  font-weight: 600;
  min-width: 0;
  overflow-wrap: anywhere;
}

.verlauf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.verlauf li {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 12px;
  padding-bottom: 14px;
  position: relative;
}
.verlauf li::before {
  content: "";
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--akzent);
  margin-top: 5px;
  margin-left: 3px;
}
.verlauf li::after {
  content: "";
  position: absolute;
  left: 8px;
  top: 20px;
  bottom: 0;
  width: 2px;
  background: var(--linie);
}
.verlauf li:last-child::after {
  display: none;
}

.betrag-zeile {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-variant-numeric: tabular-nums;
}
.betrag-zeile.summe {
  font-size: 1.25rem;
  font-weight: 750;
  border-top: 2px solid var(--tinte);
  padding-top: 8px;
}

/* Diagramme */
.diagramm svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.diagramm text {
  fill: var(--leise);
  font-size: 12px;
  font-family: var(--schrift);
}
.legende {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.9375rem;
  color: var(--leise);
}
.legende i {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  margin-right: 6px;
  vertical-align: -1px;
}
.balken-zeile {
  display: grid;
  grid-template-columns: 7.5em minmax(0, 1fr) 3.4em;
  gap: 10px;
  align-items: center;
}
.balken {
  height: 12px;
  border-radius: 6px;
  background: var(--grau-weich);
  overflow: hidden;
}
.balken > i {
  display: block;
  height: 100%;
  border-radius: 6px;
  background: var(--akzent);
}
.balken > i.hoch {
  background: var(--gelb-rand);
}

/* ---------- Anmeldung ---------- */
.anmeldung {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: calc(32px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px))
    calc(24px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
  background: radial-gradient(120% 60% at 50% 0%, var(--akzent-weich), transparent 70%), var(--bg);
}
.anmeldung .marke {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  padding-top: 12px;
}
.anmeldung .marke .logo-zeichen {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  box-shadow: var(--schatten-hoch);
}
.anmeldung .marke .logo-zeichen svg {
  width: 46px;
  height: 46px;
}
.anmeldung .marke h1 {
  font-size: 1.75rem;
}
.code-felder {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}
.code-felder span {
  height: 58px;
  border-radius: 12px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  display: grid;
  place-items: center;
  font-size: 1.625rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.code-felder span.aktiv {
  border-color: var(--akzent);
  outline: 3px solid color-mix(in srgb, var(--akzent) 35%, transparent);
}

/* Ziffernfeld (LST-02 PIN, TOTP) */
.ziffern {
  display: grid;
  grid-template-columns: repeat(3, 84px);
  gap: 14px;
  justify-content: center;
}
.ziffer {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  font-size: 2rem;
  font-weight: 600;
  font-family: var(--schrift-titel);
  box-shadow: var(--schatten);
  font-variant-numeric: tabular-nums;
}
.ziffer:active {
  background: var(--akzent-weich);
  transform: scale(0.96);
}
.ziffer.leise-taste {
  border: 0;
  background: none;
  box-shadow: none;
  font-size: 1rem;
  font-weight: 600;
  color: var(--akzent);
  font-family: var(--schrift);
}
.pin-punkte {
  display: flex;
  gap: 14px;
  justify-content: center;
}
.pin-punkte i {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--leise);
}
.pin-punkte i.voll {
  background: var(--tinte);
  border-color: var(--tinte);
}
.wackeln {
  animation: wackeln 0.35s ease;
}
@keyframes wackeln {
  20%,
  60% {
    transform: translateX(-8px);
  }
  40%,
  80% {
    transform: translateX(8px);
  }
}

/* ---------- Fahrer ---------- */
.stopp {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.stopp-kopf {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.stopp-nr {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 750;
  background: var(--akzent-weich);
  color: var(--akzent-tief);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.stopp.erledigt {
  opacity: 0.72;
}
.stopp.erledigt .stopp-nr {
  background: var(--gruen-weich);
  color: var(--gruen);
}
.stopp.naechster {
  outline: 2px solid var(--akzent);
  outline-offset: -1px;
}
.art {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 0.875rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.art.lieferung {
  color: var(--gruen);
}
.art.abholung {
  color: var(--akzent);
}
.art svg {
  width: 18px;
  height: 18px;
}
.bestaetigt {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gruen);
  font-weight: 700;
}
.bestaetigt svg {
  width: 22px;
  height: 22px;
}
.tel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  font-weight: 600;
  text-decoration: none;
}
.tel svg {
  width: 20px;
  height: 20px;
}

/* ---------- iPad ---------- */
.ipad .kopf {
  min-height: 64px;
}
.ipad .inhalt {
  padding-top: 20px;
  gap: 20px;
}
.ipad-leiste {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.ipad-leiste .knopf {
  min-height: 48px;
}
@media (max-width: 899px) {
  .ipad-leiste .knopf .txt {
    display: none;
  }
  .ipad-leiste .knopf {
    padding-inline: 12px;
  }
}
.personen {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}
.person {
  min-height: 110px;
  border-radius: 18px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  box-shadow: var(--schatten);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 1.125rem;
  font-weight: 650;
  padding: 14px;
}
.person .kuerzel {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--akzent-weich);
  color: var(--akzent-tief);
  display: grid;
  place-items: center;
  font-weight: 750;
  font-size: 1.125rem;
}
.person[disabled] {
  opacity: 0.5;
}
.person:active {
  transform: scale(0.98);
}
.auftrag-tabelle {
  width: 100%;
  border-collapse: collapse;
}
.auftrag-tabelle th {
  text-align: left;
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--leise);
  padding: 10px 14px;
  font-weight: 700;
}
.auftrag-tabelle td {
  padding: 0;
  border-top: 1px solid var(--linie);
}
.auftrag-tabelle td > button {
  width: 100%;
  min-height: 68px;
  padding: 12px 14px;
  border: 0;
  background: none;
  text-align: left;
  display: block;
  font-size: 1.0625rem;
}
.auftrag-tabelle tr:active td {

}
.auftrag-tabelle tr.rot td:first-child {

}
.auftrag-tabelle tr.gelb td:first-child {

}
.auftrag-tabelle tr.neu td {

}
@keyframes neu {

  40% {

  }
  100% {
    background: transparent;
  }
}
.ipad-raster {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
@media (orientation: landscape) and (min-width: 900px) {
  .ipad-raster {
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  }
}
.position {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.position h3 {
  font-size: 1.25rem;
}
.position .knoepfe {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.position .knoepfe .knopf {
  min-height: 56px;
  font-size: 1.0625rem;
  padding-inline: 20px;
}
.timer-laeuft {
  background: var(--gruen-weich);
  color: var(--gruen);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: 1.25rem;
}
.timer-laeuft i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: currentColor;
  animation: puls 1.4s ease infinite;
}
@keyframes puls {
  50% {
    opacity: 0.25;
  }
}
.timer-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--gruen-weich);
  color: var(--gruen);
  font-weight: 700;
  font-variant-numeric: tabular-nums;

}
.timer-chip i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: currentColor;
  animation: puls 1.4s ease infinite;
}
.stepper {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 64px;
  gap: 10px;
  align-items: center;
}
.stepper button {
  height: 64px;
  border-radius: 16px;
  border: 1px solid var(--linie);
  background: var(--flaeche);

}
.stepper output {
  text-align: center;
  font-size: 2rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  font-family: var(--schrift-titel);
}
.auswahl-gitter {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.auswahl {
  min-height: 64px;
  border-radius: 14px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  padding: 10px 12px;
  text-align: left;

  display: flex;
  flex-direction: column;

  gap: 2px;
}
.auswahl[aria-pressed="true"] {

  background: var(--akzent-weich);
  outline: 2px solid var(--akzent);
  outline-offset: -2px;
}
.auswahl .leise {
  font-weight: 500;
  font-size: 0.9375rem;
}
.ipad .blatt {
  max-width: 640px;
}
.offline-band {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px
    max(16px, env(safe-area-inset-left, 0px));
  background: var(--gelb-weich);
  color: var(--gelb);
  font-weight: 650;
  border-bottom: 1px solid var(--gelb-rand);
}
.offline-band svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.nicht-gesendet {
  background: var(--gelb-weich);
  color: var(--gelb);
}
.scanner {
  position: relative;
  aspect-ratio: 4 / 3;
  max-width: 100%;
  border-radius: 20px;
  overflow: hidden;
  background: #0b1219;
  display: grid;
  place-items: center;
}
.scanner video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.scanner .rahmen {
  width: 52%;

}
.scanner .text {
  position: absolute;
  bottom: 14px;
  left: 0;
  right: 0;
  text-align: center;

}
.laufzettel {
  display: flex;
  gap: 12px;
  align-items: center;
}
.qr {
  width: 52px;

.qr svg {

}
.leerlauf {

.leerlauf .karte {
  max-width: 460px;
  padding: 24px;

  flex-direction: column;
  gap: 14px;

/* ---------- Labor-Display (KAL-01 bis KAL-03, NFR-09: lesbar aus 3 m) ---------- */
.display {
  --d-bg: #071019;
  --d-flaeche: #0f1b27;
  --d-linie: #22344a;
  --d-tinte: #f3f7fb;
  --d-leise: #a9bccf;
  --d-rot: #ff6b5e;
  --d-gelb: #ffd24d;
  --d-akzent: #6cc4f0;
  background: var(--d-bg);
  color: var(--d-tinte);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color-scheme: dark;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px))
    calc(18px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  gap: 18px;
  font-size: clamp(18px, 1.55vw, 30px);
}
.display-kopf {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.display-kopf .logo {
  font-size: 1.35em;
}
.display-kopf .logo-zeichen {
  background: var(--d-akzent);
  color: #04263a;
  width: 1.9em;
  height: 1.9em;
}
.display-kopf .logo-zeichen svg {
  width: 1.25em;
  height: 1.25em;
}
.display-uhr {
  margin-left: auto;
  text-align: right;
}
.display-uhr b {
  font-size: 2.2em;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1;
  display: block;
  font-family: var(--schrift-titel);
}
.display-stand {
  font-size: 0.8em;
  color: var(--d-leise);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.display-stand i {
  width: 0.6em;
  height: 0.6em;
  border-radius: 50%;
  background: #4fd18b;
}
.display-stand.weg {
  color: var(--d-rot);
  font-weight: 700;
}
.display-stand.weg i {
  background: var(--d-rot);
}
.display-spalten {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.display-spalte {
  background: var(--d-flaeche);
  border: 1px solid var(--d-linie);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.display-spalte h2 {
  font-size: 1.15em;
  padding: 0.7em 0.9em;
  border-bottom: 1px solid var(--d-linie);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.display-spalte h2 span {
  color: var(--d-leise);
  font-weight: 600;
  font-size: 0.8em;
  font-family: var(--schrift);
}
.display-liste {
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.display-tag {
  padding: 0.45em 0.9em;
  font-size: 0.75em;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--d-leise);
  font-weight: 700;
  background: rgb(255 255 255 / 3%);
}
.display-eintrag {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.15em 0.8em;
  padding: 0.6em 0.9em;
  border-top: 1px solid var(--d-linie);
}
.display-eintrag.rot {
  box-shadow: inset 0.35em 0 0 var(--d-rot);
  background: rgb(255 107 94 / 10%);
}
.display-eintrag.gelb {
  box-shadow: inset 0.35em 0 0 var(--d-gelb);
  background: rgb(255 210 77 / 8%);
}
.display-eintrag .nr {
  font-weight: 750;
  font-size: 1.05em;
}
.display-eintrag .praxis {
  color: var(--d-tinte);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.display-eintrag .rechts {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.15em;
}
.display-eintrag .tech {
  font-weight: 750;
  font-size: 1.05em;
  background: rgb(108 196 240 / 16%);
  color: var(--d-akzent);
  border-radius: 0.4em;
  padding: 0 0.4em;
}
.display-eintrag .st {
  font-size: 0.8em;
  color: var(--d-leise);
  white-space: nowrap;
}
.display-eintrag .ueber {
  color: var(--d-rot);
  font-weight: 750;
}
.display-eintrag .heute {
  color: var(--d-gelb);
  font-weight: 750;
}
.display-fuss {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--d-leise);
  font-size: 0.75em;
  flex-wrap: wrap;
}
.display-fuss .legende-d {
  display: flex;
  gap: 18px;
}
.display-fuss .legende-d span::before {
  content: "";
  display: inline-block;
  width: 0.8em;
  height: 0.8em;
  border-radius: 50%;
  margin-right: 0.4em;
  vertical-align: -0.05em;
}
.display-fuss .l-rot::before {
  background: var(--d-rot);
}
.display-fuss .l-gelb::before {
  background: var(--d-gelb);
}
.display-mehr {
  padding: 0.5em 0.9em;
  color: var(--d-leise);
  font-size: 0.8em;
  border-top: 1px solid var(--d-linie);
}
.display .icon-knopf {
  color: var(--d-leise);
}
@media (max-width: 900px), (orientation: portrait) {
  .display {
    overflow-y: auto;
    font-size: 20px;
  }
  .display-spalten {
    grid-template-columns: minmax(0, 1fr);
    flex: none;
  }
  .display-liste {
    overflow: visible;
  }
}

/* ---------- Startseite (Auswahl der Vorschau) ---------- */
.start {
  min-height: 100%;
  overflow-y: auto;
  padding: calc(28px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px))
    calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: radial-gradient(90% 50% at 50% 0%, var(--akzent-weich), transparent 70%), var(--bg);
}
.start-innen {
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 26px;
}
.start h1 {
  font-size: clamp(1.75rem, 4vw, 2.6rem);
  line-height: 1.12;
}
.start .lead {
  font-size: 1.125rem;
  color: var(--leise);
  max-width: 60ch;
}
.geraete {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.geraet {
  text-align: left;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--schatten);
}
.geraet:active {
  transform: scale(0.99);
}
.geraet .bild {
  height: 132px;
  border-radius: 14px;
  background: linear-gradient(160deg, var(--akzent-weich), var(--flaeche-2));
  display: grid;
  place-items: center;
  color: var(--akzent);
}
.geraet .bild svg {
  height: 100px;
  width: auto;
}
.geraet h2 {
  font-size: 1.375rem;
}
.geraet ul {
  margin: 0;
  padding-left: 1.1em;
  color: var(--leise);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.installieren {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>

<body>
<div id="app"></div><div id="ebene" hidden></div><div id="meldungen" aria-live="polite"></div>
<script>
/* Perfect Smile · Vorschau – gemeinsamer Kern: Format (SYS-06), Zustand, Navigation, Blätter, Meldungen. */
(function () {
  "use strict";
  const PS = (window.PS = window.PS || {});

  // ---------- Format: Datum TT.MM.JJJJ, 24-Stunden-Zeit, Euro mit Komma, Anzeige in Europe/Berlin ----------
  const fmt = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
  });
  function teile(d) {
    const o = {};
    for (const p of fmt.formatToParts(d)) o[p.type] = p.value;
    return o;
  }
  PS.tagVon = (d) => {
    const t = teile(d);
    return `${t.year}-${t.month}-${t.day}`;
  };
  PS.heute = () => PS.tagVon(new Date());
  PS.datum = (x) => {
    if (typeof x === "string") {
      const [j, m, t] = x.slice(0, 10).split("-");
      return `${t}.${m}.${j}`;
    }
    const t = teile(x);
    return `${t.day}.${t.month}.${t.year}`;
  };
  PS.datumKurz = (tag) => {
    const [, m, t] = tag.split("-");
    return `${t}.${m}.`;
  };
  PS.zeit = (d) => {
    const t = teile(typeof d === "string" ? new Date(d) : d);
    return `${t.hour}:${t.minute}`;
  };
  PS.uhr = (d) => {
    const t = teile(d);
    return `${t.hour}:${t.minute}:${t.second}`;
  };
  PS.stundeBerlin = () => Number(teile(new Date()).hour);
  const WT = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  PS.wtNr = (tag) => new Date(tag + "T12:00:00Z").getUTCDay();
  PS.wochentag = (tag) => WT[PS.wtNr(tag)];
  PS.wtKurz = (tag) => WT[PS.wtNr(tag)].slice(0, 2);
  PS.plusTage = (tag, n) => {
    const d = new Date(tag + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  PS.istWerktag = (tag) => {
    const w = PS.wtNr(tag);
    return w !== 0 && w !== 6;
  };
  PS.plusArbeitstage = (tag, n) => {
    let d = tag;
    const s = n < 0 ? -1 : 1;
    let k = Math.abs(n);
    while (k > 0) {
      d = PS.plusTage(d, s);
      if (PS.istWerktag(d)) k--;
    }
    return d;
  };
  PS.tageZwischen = (a, b) =>
    Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 86400000);
  PS.tagName = (tag) => {
    const h = PS.heute();
    const d = PS.tageZwischen(h, tag);
    if (d === 0) return "Heute";
    if (d === 1) return "Morgen";
    if (d === -1) return "Gestern";
    return `${PS.wochentag(tag)}, ${PS.datumKurz(tag)}`;
  };
  /** Ganze Cent → „1.234,56 €“ (nie toLocaleString, wie in der echten Anwendung) */
  PS.euro = (cent) => {
    const neg = cent < 0;
    const c = Math.abs(Math.round(cent));
    const e = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return `${neg ? "−" : ""}${e},${String(c % 100).padStart(2, "0")} €`;
  };
  PS.euroKurz = (cent) => {
    const e = Math.round(cent / 100);
    if (Math.abs(e) >= 1000) return `${String(Math.round(e / 100) / 10).replace(".", ",")} Tsd. €`;
    return `${e} €`;
  };
  /** „1.234,5“ oder „12,50“ → Cent; null bei ungültiger Eingabe */
  PS.leseEuro = (text) => {
    const t = String(text).trim().replace(/\s|€/g, "").replace(/\./g, "");
    if (!/^\d+(,\d{1,2})?$/.test(t)) return null;
    const [e, c = "0"] = t.split(",");
    return Number(e) * 100 + Number(c.padEnd(2, "0"));
  };
  PS.dauer = (min) =>
    min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")} min`;
  PS.stunden = (min) => `${String(Math.round(min / 6) / 10).replace(".", ",")} h`;
  PS.prozent = (x) => `${String(Math.round(x * 100))} %`;
  PS.laufzeit = (sek) => {
    const h = Math.floor(sek / 3600),
      m = Math.floor((sek % 3600) / 60),
      s = sek % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  };
  /** Kaufmännisch runden, halber Cent vom Nullpunkt weg (ANNAHME aus DECISIONS, Rundung) */
  PS.runde = (x) => Math.sign(x) * Math.round(Math.abs(x));
  PS.esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  PS.mehrzahl = (n, eins, viele) => `${n} ${n === 1 ? eins : viele}`;

  // ---------- Zustand (nur im Gerät, erfundene Daten; DS-15) ----------
  const SCHLUESSEL = "perfect-smile-vorschau";
  PS.lade = () => {
    try {
      const roh = localStorage.getItem(SCHLUESSEL);
      if (roh) {
        const z = JSON.parse(roh);
        if (z && z.version === PS.DATENVERSION && z.tag === PS.heute()) return z;
      }
    } catch {
      /* Speicher gesperrt: frische Daten */
    }
    return PS.erzeugeDaten(PS.heute());
  };
  let speicherUhr = 0;
  PS.speichere = () => {
    clearTimeout(speicherUhr);
    speicherUhr = setTimeout(() => {
      try {
        localStorage.setItem(SCHLUESSEL, JSON.stringify(PS.z));
      } catch {
        /* egal */
      }
    }, 120);
  };
  PS.zuruecksetzen = () => {
    try {
      localStorage.removeItem(SCHLUESSEL);
    } catch {
      /* egal */
    }
    const modus = PS.z && PS.z.modus;
    PS.z = PS.erzeugeDaten(PS.heute());
    if (modus) PS.z.modus = modus;
    PS.nav = [];
    PS.schliesseBlatt(true);
    PS.render();
    PS.meldung("Vorschau zurückgesetzt");
  };
  PS.id = (vorsilbe) =>
    `${vorsilbe}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

  // ---------- Navigation (Ansichten-Stapel, Zurück-Taste von Android und Browser) ----------
  PS.nav = [];
  PS.ansicht = () => PS.nav[PS.nav.length - 1] || null;
  PS.geh = (name, daten = {}) => {
    PS.nav.push({ name, ...daten });
    try {
      history.pushState({ ps: PS.nav.length }, "");
    } catch {
      /* egal */
    }
    PS.render(true);
  };
  PS.ersetze = (name, daten = {}) => {
    PS.nav = [{ name, ...daten }];
    PS.render(true);
  };
  PS.zurueck = () => {
    if (PS.blattOffen()) {
      PS.schliesseBlatt();
      return true;
    }
    if (PS.nav.length > 1) {
      PS.nav.pop();
      PS.render(true);
      return true;
    }
    return false;
  };
  window.addEventListener("popstate", () => {
    PS.zurueck();
  });
  /** Für die Android-Hülle (APK): true, wenn die App selbst zurückgegangen ist */
  window.psZurueck = () => PS.zurueck();

  // ---------- Rendern ----------
  PS.module = {};
  PS.render = (neueAnsicht) => {
    const m = PS.module[PS.z.modus] || PS.module.start;
    const app = document.getElementById("app");
    const scroller = app.querySelector(".inhalt");
    const pos = scroller && !neueAnsicht ? scroller.scrollTop : 0;
    app.innerHTML = m.render();
    const neu = app.querySelector(".inhalt");
    if (neu) neu.scrollTop = pos;
    document.body.classList.toggle("mit-rahmen", m.rahmen === true);
    if (m.nachRender) m.nachRender();
    PS.tick();
    PS.speichere();
  };
  PS.wechsleModus = (modus) => {
    PS.z.modus = modus;
    PS.nav = [];
    PS.schliesseBlatt(true);
    PS.render(true);
  };

  // Sekundentakt: nur markierte Stellen aktualisieren (Uhr, Timer)
  PS.tick = () => {
    const jetzt = Date.now();
    document.querySelectorAll("[data-seit]").forEach((el) => {
      const sek = Math.max(0, Math.floor((jetzt - Date.parse(el.dataset.seit)) / 1000));
      el.textContent = PS.laufzeit(sek);
    });
    document.querySelectorAll("[data-uhr]").forEach((el) => {
      el.textContent = el.dataset.uhr === "sek" ? PS.uhr(new Date()) : PS.zeit(new Date());
    });
    const m = PS.module[PS.z && PS.z.modus];
    if (m && m.tick) m.tick();
  };
  setInterval(() => PS.tick(), 1000);

  // ---------- Ereignisse ----------
  PS.aktionen = {};
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!el || el.disabled) return;
    const f = PS.aktionen[el.dataset.a];
    if (!f) return;
    e.preventDefault();
    PS.tipp();
    f(el, e);
    PS.speichere();
  });
  document.addEventListener("submit", (e) => {
    const form = e.target.closest("form[data-senden]");
    if (!form) return;
    e.preventDefault();
    const f = PS.aktionen[form.dataset.senden];
    if (f) {
      PS.tipp();
      f(form, new FormData(form));
      PS.speichere();
    }
  });
  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-eingabe]");
    if (!el) return;
    const f = PS.aktionen[el.dataset.eingabe];
    if (f) f(el, e);
  });
  PS.tipp = () => {
    try {
      if (navigator.vibrate) navigator.vibrate(8);
    } catch {
      /* egal */
    }
  };

  // ---------- Blatt (Dialog von unten) ----------
  let blattZu = null;
  PS.blattOffen = () => !document.getElementById("ebene").hidden;
  PS.blatt = (html, { titel = "", fest = false, klasse = "", beimSchliessen = null } = {}) => {
    const eb = document.getElementById("ebene");
    eb.innerHTML = `<div class="blatt-hg" ${fest ? "" : 'data-a="blattZu"'}></div>
      <div class="blatt ${klasse}" role="dialog" aria-modal="true" aria-label="${PS.esc(titel)}"><div class="blatt-griff"></div>${html}</div>`;
    eb.hidden = false;
    blattZu = beimSchliessen;
    requestAnimationFrame(() => requestAnimationFrame(() => eb.classList.add("offen")));
    const erstes = eb.querySelector("[autofocus]");
    if (erstes) setTimeout(() => erstes.focus(), 280);
  };
  PS.schliesseBlatt = (sofort) => {
    const eb = document.getElementById("ebene");
    if (!eb || eb.hidden) return;
    eb.classList.remove("offen");
    const fertig = () => {
      eb.hidden = true;
      eb.innerHTML = "";
    };
    if (sofort) fertig();
    else setTimeout(fertig, 240);
    const f = blattZu;
    blattZu = null;
    if (f) f();
  };
  PS.aktionen.blattZu = () => PS.schliesseBlatt();
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && PS.blattOffen()) PS.schliesseBlatt();
  });

  /** Rückfrage im Blatt statt confirm() */
  PS.frage = ({ titel, text, ja, nein = "Abbrechen", gefahr = false, beiJa }) => {
    PS._beiJa = beiJa;
    PS.blatt(
      `<h2>${PS.esc(titel)}</h2>${text ? `<p class="leise">${text}</p>` : ""}
      <div class="knoepfe"><button class="knopf gross ${gefahr ? "gefahr" : ""}" data-a="frageJa">${PS.esc(ja)}</button>
      <button class="knopf gross zweit" data-a="blattZu">${PS.esc(nein)}</button></div>`,
      { titel },
    );
  };
  PS.aktionen.frageJa = () => {
    const f = PS._beiJa;
    PS._beiJa = null;
    PS.schliesseBlatt();
    if (f) f();
  };

  // ---------- Meldungen ----------
  PS.meldung = (text, art = "ok") => {
    const box = document.getElementById("meldungen");
    const el = document.createElement("div");
    el.className = "meldung";
    el.setAttribute("role", "status");
    el.innerHTML = `${PS.icon(art === "warn" ? "warn" : art === "info" ? "info" : "check")}<span>${PS.esc(text)}</span>`;
    box.appendChild(el);
    setTimeout(() => {
      el.classList.add("weg");
      setTimeout(() => el.remove(), 260);
    }, 3200);
  };

  // ---------- Symbole (eigene, schlichte Linien-Icons) ----------
  const P = {
    zahn: '<path d="M7.5 3.5c-2.2 0-3.9 1.8-3.9 4.4 0 2.3.9 3.6 1.5 5.4.7 2.1.9 7.2 2.6 7.2 1.6 0 1.6-4.9 2.4-6.2.4-.7.8-1 1.4-1h1c.6 0 1 .3 1.4 1 .8 1.3.8 6.2 2.4 6.2 1.7 0 1.9-5.1 2.6-7.2.6-1.8 1.5-3.1 1.5-5.4 0-2.6-1.7-4.4-3.9-4.4-1.8 0-2.6 1-4.5 1s-2.7-1-4.5-1z"/>',
    start:
      '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/>',
    liste:
      '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
    rechnung: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
    mehr: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
    auto: '<path d="M3 16.5V12l2-5h10.5l3.5 5h2v4.5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6M5 12h14"/>',
    kalender:
      '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/>',
    glocke: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    pfeil: '<path d="m9 5 7 7-7 7"/>',
    zurueck: '<path d="m15 5-7 7 7 7"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    kreischeck: '<circle cx="12" cy="12" r="9"/><path d="m7.8 12.3 2.9 2.9 5.5-5.7"/>',
    warn: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.3"/>',
    telefon:
      '<path d="M5 3.5h3.5l1.8 4.6-2.3 1.5a11 11 0 0 0 6.4 6.4l1.5-2.3 4.6 1.8V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
    hoch: '<path d="M12 19V5M6 11l6-6 6 6"/>',

  function weiterNachPasswort(rolle) {
    h().rolle = rolle;
    if (rolle === "inhaber") {
      h().schritt = "code";
      h().code = "";

    PS.render(true);
  }
  function anmeldungFertig() {
    h().schritt = "app";
    h().seit = new Date().toISOString();
    PS.nav = [{ name: h().rolle === "fahrer" ? "tour" : "start" }];
  }
  function code() {
    const c = h().code || "";

      <div class="marke">${PS.logoZeichen()}<div><h1>Bestätigungscode</h1><p class="leise">Ines Testinhaber</p></div></div>
      <p style="text-align:center">Geben Sie den 6-stelligen Code aus Ihrer Authenticator-App ein.</p>
      <div class="code-felder" aria-label="Eingegebener Code">${[0, 1, 2, 3, 4, 5].map((i) => `<span class="${i === c.length ? "aktiv" : ""}">${c[i] || ""}</span>`).join("")}</div>
      <p class="leise klein" style="text-align:center">In der Vorschau gilt jeder Code.</p>
      ${ziffernfeld("codeTaste")}
      <button class="knopf text" data-a="abbrechenCode">Abbrechen</button>
    </div>`;
  }
  function ziffernfeld(aktion) {
    const t = (z) =>
      `<button class="ziffer" data-a="${aktion}" data-z="${z}" aria-label="${z}">${z}</button>`;
    return `<div class="ziffern">${["1", "2", "3", "4", "5", "6", "7", "8", "9"].map(t).join("")}
      <button class="ziffer leise-taste" data-a="${aktion}" data-z="weg" aria-label="Alles löschen">Löschen</button>${t("0")}
      <button class="ziffer leise-taste" data-a="${aktion}" data-z="zurueck" aria-label="Letzte Ziffer löschen">${I("zurueck")}</button></div>`;
  }
  PS.aktionen.codeTaste = (el) => {
    const z = el.dataset.z;
    let c = h().code || "";
    if (z === "weg") c = "";
    else if (z === "zurueck") c = c.slice(0, -1);
    else if (c.length < 6) c += z;
    h().code = c;
    PS.render();
    if (c.length === 6)
      setTimeout(() => {
        anmeldungFertig();
        PS.render(true);
        PS.meldung("Angemeldet mit zweitem Faktor");
      }, 280);
  };
  PS.aktionen.abbrechenCode = () => {
    h().schritt = "anmelden";
    PS.render(true);
  };
  PS.aktionen.abmelden = () =>
    PS.frage({
      titel: "Abmelden?",
      text: "Sie müssen sich danach neu anmelden.",
      ja: "Abmelden",
      beiJa: () => {
        h().schritt = "anmelden";
        h().rolle = null;
        PS.nav = [];
        PS.render(true);
      },
    });

  // ---------- Fahrer ----------
  function tourHeute() {
    return PS.z.touren.find((t) => t.tag === PS.heute() && t.fahrer === "FT");
  }
  function stoppKarte(t, s, i, naechster, bedienbar) {
    const p = PS.praxis(s.praxis);
    const auftr = s.auftraege.map((id) => PS.auftrag(id)).filter(Boolean);
    const lief = s.art === "lieferung";
    return `<article class="karte stopp ${s.bestaetigtAm ? "erledigt" : ""} ${naechster ? "naechster" : ""}">
      <div class="stopp-kopf"><span class="stopp-nr">${s.bestaetigtAm ? I("check") : i + 1}</span>
        <div class="stapel wachse">
          <span class="art ${s.art}">${I(lief ? "runter" : "hoch")} ${lief ? "Lieferung" : "Abholung"}${naechster ? ' · <span style="color:var(--akzent)">nächster Stopp</span>' : ""}</span>
          <h3 style="font-size:1.1875rem">${e(p.name)}</h3>
          <span class="leise">${e(p.strasse)}, ${e(p.plz)} ${e(p.ort)}</span>
        </div></div>
      ${auftr.map((a) => `<div class="zeile"><span class="wachse"><span class="fett nr">Auftrag ${a.nr}</span> · ${e(a.arbeitsart)}</span>${PS.statusPille(a.status)}</div>`).join("")}
      ${s.notiz ? `<p class="zeile oben leise">${I("notiz").replace("<svg", '<svg style="width:20px;height:20px;flex-shrink:0;margin-top:2px"')}<span>${e(s.notiz)}</span></p>` : ""}
      <a class="tel" href="tel:${p.tel.replace(/\s/g, "")}">${I("telefon")} ${e(p.tel)}</a>
      ${
        s.bestaetigtAm
          ? `<p class="bestaetigt">${I("kreischeck")} ${lief ? "Geliefert" : "Abgeholt"} um ${PS.zeit(s.bestaetigtAm)} Uhr · ${e(PS.mitarbeiter(s.bestaetigtVon).name)}</p>`
          : bedienbar
            ? `<button class="knopf gross voll ${lief ? "gruen" : ""}" data-a="stopp" data-id="${s.id}">${I(lief ? "check" : "hoch")} ${lief ? "Geliefert" : "Abgeholt"}</button>`
            : ""
      }
    </article>`;
  }
  function tour() {
    const t = tourHeute();
    const datum = `${PS.wochentag(PS.heute())}, ${PS.datum(PS.heute())}`;
    if (!t)
      return schale({
        titel: "Meine Tour",
        unter: datum,
        inhalt: `<div class="leer">${I("auto")}<p>Heute ist keine Tour für Sie geplant.</p></div>`,
      });
    const fertig = t.stopps.filter((s) => s.bestaetigtAm).length;
    const naechsterId = (t.stopps.find((s) => !s.bestaetigtAm) || {}).id;
    const abschluss = t.abgeschlossenAm
      ? `<div class="hinweis gruen">${I("kreischeck")}<div><p class="fett">Tour abgeschlossen um ${PS.zeit(t.abgeschlossenAm)} Uhr</p><p>${t.kmEnde - t.kmStart} km gefahren (${punkte(t.kmStart)} → ${punkte(t.kmEnde)} km)</p></div></div>`
      : `<form class="karte innen" data-senden="tourAbschliessen" novalidate>
          <h2 style="font-size:1.125rem">Tour abschließen</h2>
          <p class="leise">Kilometerstand vom Tacho eintragen.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="feld"><label for="kmStart">km Start</label><input class="eingabe zahl" id="kmStart" name="kmStart" inputmode="numeric" pattern="[0-9]*" value="${e(h().kmStart || "48210")}"></div>
            <div class="feld"><label for="kmEnde">km Ende</label><input class="eingabe zahl" id="kmEnde" name="kmEnde" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 48262" value="${e(h().kmEnde || "")}"></div>
          </div>
          ${h().kmFehler ? `<p class="fehler" role="alert">${e(h().kmFehler)}</p>` : ""}
          <button class="knopf gross voll" type="submit">Tour abschließen</button>
        </form>`;
    return schale({
      titel: "Meine Tour",
      unter: datum,
      inhalt: `<section class="karte innen">
          <div class="zeile"><span class="logo-zeichen" style="background:var(--akzent-weich);color:var(--akzent-tief)">${I("auto")}</span>
            <div class="stapel wachse"><span class="fett">Fahrzeug ${e(t.fahrzeug)}</span><span class="leise">${PS.mehrzahl(t.stopps.length, "Stopp", "Stopps")} · ${t.stopps.filter((s) => s.art === "lieferung").length} Lieferungen, ${t.stopps.filter((s) => s.art === "abholung").length} Abholungen</span></div>
            <span class="fett zahl" style="font-size:1.25rem">${fertig}/${t.stopps.length}</span></div>
          <div class="fortschritt" role="progressbar" aria-valuemin="0" aria-valuemax="${t.stopps.length}" aria-valuenow="${fertig}" aria-label="Erledigte Stopps"><i style="width:${(fertig / t.stopps.length) * 100}%"></i></div>
          ${fertig === t.stopps.length && !t.abgeschlossenAm ? `<p class="fett" style="color:var(--gruen)">Alle Stopps erledigt. Bitte noch den Kilometerstand eintragen.</p>` : ""}
        </section>
        ${t.stopps.map((s, i) => stoppKarte(t, s, i, s.id === naechsterId, true)).join("")}
        ${abschluss}
        <p class="leise klein" style="text-align:center">Sie sehen nur Abhol- und Lieferdaten. Patientendaten erscheinen in dieser Ansicht nie.</p>`,
    });
  }
  function punkte(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }
  PS.aktionen.stopp = (el) => {
    const t = tourHeute();
    const s = t.stopps.find((x) => x.id === el.dataset.id);
    const p = PS.praxis(s.praxis);
    const lief = s.art === "lieferung";
    const auftr = s.auftraege.map((id) => PS.auftrag(id));
    PS.frage({
      titel: lief ? "Lieferung bestätigen?" : "Abholung bestätigen?",
      text: `${e(p.name)}${lief && auftr.length ? `<br>${auftr.map((a) => `Auftrag ${a.nr}`).join(", ")} wird auf „Ausgeliefert“ gesetzt.` : ""}<br>Uhrzeit und Ihr Name werden gespeichert.`,
      ja: lief ? "Ja, geliefert" : "Ja, abgeholt",
      beiJa: () => {
        s.bestaetigtAm = new Date().toISOString();
        s.bestaetigtVon = "FT";
        for (const a of auftr)
          if (a.status === "versandbereit") PS.setzeStatus(a, "ausgeliefert", "FT");
        PS.render();
        PS.meldung(
          lief
            ? `Geliefert um ${PS.zeit(s.bestaetigtAm)} Uhr${auftr.length ? ` · ${auftr[0].nr} ist ausgeliefert` : ""}`
            : `Abholung bestätigt um ${PS.zeit(s.bestaetigtAm)} Uhr`,
        );
      },
    });
  };
  PS.aktionen.tourAbschliessen = (form, d) => {
    const t = tourHeute();
    const a = String(d.get("kmStart") || "").trim(),
      b = String(d.get("kmEnde") || "").trim();
    h().kmStart = a;
    h().kmEnde = b;
    if (!/^\d+$/.test(a) || !/^\d+$/.test(b))
      h().kmFehler = "Bitte beide Kilometerstände als ganze Zahl eintragen.";
    else if (Number(b) <= Number(a))
      h().kmFehler = "Der Kilometerstand am Ende muss größer sein als am Start. Bitte prüfen.";
    else if (Number(b) - Number(a) > 1500)
      h().kmFehler = "Mehr als 1.500 km an einem Tag? Bitte die Eingabe prüfen.";
    else {
      h().kmFehler = "";
      const offen = t.stopps.filter((s) => !s.bestaetigtAm).length;
      const fertig = () => {
        t.kmStart = Number(a);
        t.kmEnde = Number(b);
        t.abgeschlossenAm = new Date().toISOString();
        PS.render();
        PS.meldung(`Tour abgeschlossen · ${t.kmEnde - t.kmStart} km`);
      };
      if (offen) {
        PS.frage({
          titel: "Tour trotzdem abschließen?",
          text: `${PS.mehrzahl(offen, "Stopp ist", "Stopps sind")} noch nicht bestätigt.`,
          ja: "Abschließen",
          beiJa: fertig,
        });
        return;
      }
      fertig();
      return;
    }
    PS.render();
  };
  function woche() {
    const tage = [0, 1, 2, 3, 4].map((n) =>
      n === 0 ? PS.heute() : PS.plusArbeitstage(PS.heute(), n),
    );
    return schale({
      titel: "Meine Woche",
      unter: "Touren der nächsten Arbeitstage",
      inhalt: `<div class="liste">${tage
        .map((tag) => {
          const t = PS.z.touren.find((x) => x.tag === tag && x.fahrer === "FT");
          const n = t ? t.stopps.length : 0;
          return `<button class="eintrag" data-a="${t ? "tagAnsehen" : ""}" data-tag="${tag}" ${t ? "" : "disabled"}>
          <span class="stopp-nr" style="width:48px;height:48px;border-radius:12px;flex-direction:column;line-height:1.1"><span style="font-size:0.8125rem">${PS.wtKurz(tag)}</span><span>${tag.slice(8, 10)}</span></span>
          <span class="stapel wachse"><span class="fett">${PS.tagName(tag)}</span><span class="leise">${t ? `${PS.mehrzahl(n, "Stopp", "Stopps")} · ${e(t.fahrzeug)}` : "Keine Tour"}</span></span>${t ? I("pfeil") : ""}</button>`;
        })
        .join("")}</div>
      <p class="leise klein">Abwesenheiten trägt die Verwaltung ein. Gespeichert wird nur die Art (Urlaub oder abwesend), nie ein Grund.</p>`,
    });
  }
  PS.aktionen.tagAnsehen = (el) => {
    if (el.dataset.tag === PS.heute()) return PS.ersetze("tour");
    PS.geh("tag", { tag: el.dataset.tag });
  };
  function tagAnsicht(v) {
    const t = PS.z.touren.find((x) => x.tag === v.tag && x.fahrer === "FT");
    return schale({
      titel: PS.tagName(v.tag),
      unter: `${PS.datum(v.tag)} · Fahrzeug ${e(t.fahrzeug)}`,
      zurueck: true,
      inhalt: `${t.stopps.map((s, i) => stoppKarte(t, s, i, false, false)).join("")}<p class="leise klein" style="text-align:center">Bestätigen geht erst am Tag der Tour.</p>`,
    });
  }
  function profil() {
    const m = PS.mitarbeiter("FT");
    return schale({
      titel: "Profil",
      inhalt: `
      <section class="karte innen"><div class="zeile"><span class="person" style="all:unset"><span class="kuerzel" style="width:56px;height:56px;border-radius:50%;background:var(--gruen-weich);color:var(--gruen);display:grid;place-items:center;font-weight:750">FT</span></span>
        <div class="stapel"><span class="fett" style="font-size:1.125rem">${e(m.name)}</span><span class="leise">Fahrer · Fahrzeug B-PS 101</span></div></div></section>
      <section class="abschnitt"><h2>Anmeldung</h2><div class="karte innen">
        <dl class="info-raster"><dt>Angemeldet seit</dt><dd>${h().seit ? PS.zeit(h().seit) + " Uhr" : "–"}</dd><dt>Bleibt angemeldet</dt><dd>bis zu 12 Stunden</dd><dt>Ohne Nutzung</dt><dd>nach 60 Minuten abgemeldet</dd></dl>
        <p class="leise klein">Beide Zeiten stellt das Labor ein. Mit installierter App öffnet der Fahrer einfach das Symbol auf dem Home-Bildschirm.</p></div></section>
      <section class="abschnitt"><h2>Was Fahrer sehen</h2><div class="hinweis">${I("schloss")}<p>Nur eigene Touren mit Abhol- und Lieferdaten. Keine Preise, keine Rechnungen, keine Patientendaten.</p></div></section>
      <div class="abstand-8">
        ${PS.istInstalliert() ? "" : `<button class="knopf gross voll weich" data-a="installieren">${I("teilen")} Auf den Home-Bildschirm</button>`}
        <button class="knopf gross voll zweit" data-a="vorfuehren">${I("vorfuehren")} Vorführen</button>
        <button class="knopf gross voll zweit" data-a="abmelden">${I("abmelden")} Abmelden</button>
      </div>`,
    });
  }

  // ---------- Inhaber: Startseite (DSH-01, DSH-04) ----------
  const FILTER = {
    offen: { name: "Alle offenen", f: (a) => PS.OFFEN.includes(a.status) },
    ueberfaellig: { name: "Überfällig", f: (a) => PS.ampel(a) === "rot" },
    heute: { name: "Heute fällig", f: (a) => PS.ampel(a) === "gelb" },
    in_fertigung: { name: "In Fertigung", f: (a) => a.status === "in_fertigung" },
    rueckfrage: { name: "Rückfrage", f: (a) => a.status === "rueckfrage" },
    qualitaetskontrolle: {
      name: "Qualitätskontrolle",
      f: (a) => a.status === "qualitaetskontrolle",
    },
    angenommen: { name: "Nicht zugewiesen", f: (a) => a.status === "angenommen" },
    versandbereit: { name: "Versandbereit", f: (a) => a.status === "versandbereit" },
    ausgeliefert: { name: "Ausgeliefert", f: (a) => a.status === "ausgeliefert" },
    storniert: { name: "Storniert", f: (a) => a.status === "storniert" },
  };
  const anzahl = (k) => PS.z.auftraege.filter(FILTER[k].f).length;
  function start() {
    const std = PS.stundeBerlin();
    const gruss = std < 11 ? "Guten Morgen" : std < 18 ? "Guten Tag" : "Guten Abend";
    const entw = PS.z.rechnungen.filter((r) => r.status === "entwurf");
    const touren = PS.z.touren.filter((t) => t.tag === PS.heute());
    const stopps = touren.flatMap((t) => t.stopps);
    const kachel = (k, was, farbe) =>
      `<button class="kachel ${anzahl(k) ? farbe : ""}" data-a="zuAuftraegen" data-f="${k}"><span class="wert">${anzahl(k)}</span><span class="was">${was}</span></button>`;
    return schale({
      titel: `${gruss}, Ines`,
      unter: `${PS.wochentag(PS.heute())}, ${PS.datum(PS.heute())}`,
      rechts: glocke(),
      inhalt: `<div class="kacheln">${kachel("heute", "heute fällig", "gelb")}${kachel("ueberfaellig", "überfällig", "rot")}${kachel("in_fertigung", "in Fertigung", "")}${kachel("rueckfrage", "offene Rückfragen", "gelb")}</div>
      ${
        entw.length
          ? `<button class="karte innen" data-a="tab" data-t="rechnungen" style="text-align:left;border-color:var(--akzent)">
          <div class="zeile"><span class="logo-zeichen">${I("rechnung")}</span><div class="stapel wachse"><span class="fett">${PS.mehrzahl(entw.length, "Rechnung wartet", "Rechnungen warten")} auf Ihre Freigabe</span><span class="leise zahl">zusammen ${PS.euro(entw.reduce((s, r) => s + PS.summen(r).brutto, 0))} brutto</span></div>${I("pfeil")}</div></button>`
          : ""
      }
      <section class="abschnitt"><h2>Heute unterwegs</h2><div class="karte innen">
        <div class="zeile"><span class="wachse">${PS.mehrzahl(touren.length, "Tour", "Touren")} · ${PS.mehrzahl(stopps.length, "Stopp", "Stopps")}</span><span class="fett zahl">${stopps.filter((s) => s.bestaetigtAm).length} erledigt</span></div>
        <div class="fortschritt"><i style="width:${stopps.length ? (stopps.filter((s) => s.bestaetigtAm).length / stopps.length) * 100 : 0}%"></i></div>
        ${stopps
          .filter((s) => s.bestaetigtAm)
          .slice(-2)
          .map(
            (s) =>
              `<p class="leise klein">${I("check").replace("<svg", '<svg style="width:16px;height:16px;vertical-align:-3px;color:var(--gruen)"')} ${s.art === "lieferung" ? "Geliefert" : "Abgeholt"}: ${e(PS.praxis(s.praxis).kurz)} um ${PS.zeit(s.bestaetigtAm)} Uhr</p>`,
          )
          .join("")}
      </div></section>
      <section class="abschnitt"><h2>Erinnerungen</h2><div class="liste">${PS.z.erinnerungen
        .map(
          (
            r,
          ) => `<button class="eintrag" ${r.ziel ? `data-a="geh" data-v="rechnung" data-id="${r.ziel}"` : "disabled"} style="${r.ziel ? "" : "opacity:1"}">
          <span class="ampel ${r.art}" style="width:10px"></span><span class="stapel wachse"><span class="fett">${e(r.text)}</span><span class="leise">${e(r.wann)}</span></span>${r.ziel ? I("pfeil") : ""}</button>`,
        )
        .join("")}</div></section>`,

  }
  PS.aktionen.zuAuftraegen = (el) => {

    PS.render(true);
  };

  // ---------- Inhaber: Aufträge (AUF-08) ----------
  function auftragZeile(a) {
    const amp = PS.ampel(a);
    return `<button class="eintrag" data-a="geh" data-v="auftrag" data-id="${a.id}" style="${amp === "rot" ? "box-shadow:inset 5px 0 0 var(--rot)" : amp === "gelb" ? "box-shadow:inset 5px 0 0 var(--gelb-rand)" : ""}">
      <span class="stapel wachse">
        <span class="zeile"><span class="fett nr wachse">${a.nr}</span>${PS.statusPille(a.status)}</span>
        <span>${e(PS.praxis(a.praxis).kurz)} · ${e(a.arbeitsart)}</span>
        <span class="zeile leise"><span class="wachse">${PS.terminText(a)}</span><span class="fett">${a.techniker || "–"}</span></span>
      </span></button>`;
  }
  function trefferListe(f, q) {
    const s = (q || "").trim().toLowerCase();
    const liste = PS.z.auftraege
      .filter(FILTER[f].f)
      .filter(
        (a) =>
          !s ||
          a.nr.includes(s) ||

      )
      .sort((a, b) => a.termin.localeCompare(b.termin));
    if (!liste.length)
      return `<div class="leer">${I("suche")}<p>Keine Aufträge gefunden.${s ? " Andere Suche versuchen." : ""}</p></div>`;
    return `<p class="leise klein" style="padding-left:4px">${PS.mehrzahl(liste.length, "Auftrag", "Aufträge")}</p><div class="liste">${liste.map(auftragZeile).join("")}</div>`;
  }
  function auftraege(v) {
    const f = v.f || "offen";
    return schale({
      titel: "Aufträge",
      rechts: glocke(),
      inhalt: `<div class="feld"><label class="vh" for="suche">Suchen</label><input class="eingabe" id="suche" type="search" placeholder="Auftragsnummer, Praxis oder Arbeitsart" data-eingabe="suche" value="${e(v.q || "")}" autocomplete="off"></div>
      <div class="chips" role="group" aria-label="Filter">${Object.keys(FILTER)
        .map(
          (k) =>
            `<button class="chip" data-a="filter" data-f="${k}" aria-pressed="${k === f}">${FILTER[k].name} <span class="anz">${anzahl(k)}</span></button>`,
        )
        .join("")}</div>
      <div id="treffer" class="abstand-8">${trefferListe(f, v.q)}</div>`,
    });
  }
  PS.aktionen.filter = (el) => {

    PS.render();
  };
  PS.aktionen.suche = (el) => {
    const v = PS.ansicht();

    document.getElementById("treffer").innerHTML = trefferListe(v.f || "offen", v.q);
  };

  // ---------- Inhaber: Auftrag ----------
  function auftragAnsicht(v) {
    const a = PS.auftrag(v.id);
    const p = PS.praxis(a.praxis);

                  )

  PS.aktionen.wechsel = (el) => {

  PS.aktionen.wechselNotiz = (form, d) => {

  /** AUF-06/07, KAL-06: Zuweisen mit geplanten Stunden der nächsten 5 Arbeitstage, Abwesende gekennzeichnet */
  function geplant(k) {
    const basis = {
      TT: [7.5, 8, 6, 5, 3],
      TA: [8, 7, 7.5, 4, 2],
      TI: [5, 6.5, 4, 3, 2],
      TL: [7, 7.5, 8, 6, 4],
      TH: [0, 0, 0, 0, 0],
    }[k];
    return basis;
  }
  function zuweisen(a) {
    const tage = [1, 2, 3, 4, 5].map((n) => PS.plusArbeitstage(PS.heute(), n - 1));
    const techs = Object.values(PS.z.mitarbeiter).filter((m) => m.rollen.includes("techniker"));
    PS._zuweisen = { a: a.id, wahl: null };
    PS.blatt(
      `<h2>Techniker zuweisen</h2><p class="leise">Geplante Stunden der nächsten 5 Arbeitstage (${tage.map((t) => PS.wtKurz(t)).join(", ")}).</p>
      <div class="liste" id="techWahl">${techs
        .map((m) => {
          const g = geplant(m.kuerzel);
          const tagStd = m.std / 5;
          return `<button class="eintrag" data-a="techWahl" data-k="${m.kuerzel}" ${m.abwesend ? 'aria-disabled="true" style="opacity:.6"' : ""}>
          <span class="stopp-nr">${m.kuerzel}</span>
          <span class="stapel wachse"><span class="fett">${e(m.name)}${m.abwesend ? ` · <span style="color:var(--gelb)">${e(m.abwesend)}</span>` : ""}</span>
          <span style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">${g.map((x) => `<span title="${PS.stunden(x * 60)}" style="height:22px;border-radius:5px;background:var(--grau-weich);position:relative;overflow:hidden"><i style="position:absolute;left:0;bottom:0;right:0;height:${Math.min(100, (x / tagStd) * 100)}%;background:${x > tagStd ? "var(--gelb-rand)" : "var(--akzent)"};opacity:.85"></i></span>`).join("")}</span>
          <span class="leise klein zahl">${m.abwesend ? "diese Woche nicht da" : `${PS.stunden(g.reduce((s, x) => s + x, 0) * 60)} von ${m.std} h verplant`}</span></span>
          <span class="wahl-haken" data-k="${m.kuerzel}" aria-hidden="true"></span></button>`;
        })
        .join("")}</div>
      <div class="knoepfe"><button class="knopf gross" id="zuweisenOk" data-a="zuweisenOk" disabled>Zuweisen</button><button class="knopf gross zweit" data-a="blattZu">Abbrechen</button></div>`,
      { titel: "Zuweisen" },
    );
  }
  PS.aktionen.techWahl = (el) => {
    if (el.getAttribute("aria-disabled") === "true") {
      PS.meldung("Abwesend – bitte jemand anderen wählen", "warn");

    PS._zuweisen.wahl = el.dataset.k;
    document.querySelectorAll("#techWahl .eintrag").forEach((x) => {

  PS.aktionen.zuweisenOk = () => {

      text: `Auftrag ${a.nr} wurde Ihnen zugewiesen`,

      gelesen: false,

    PS.schliesseBlatt();

    PS.meldung(`Zugewiesen an ${PS.mitarbeiter(k).name} · erscheint sofort auf dem iPad`);

  // ---------- Inhaber: Rechnungen (RE-01 bis RE-10) ----------
  function rechnungen(v) {
    const seg = v.seg || "entwurf";
    const alle = PS.z.rechnungen;
    const frei = alle.filter((r) => r.status === "freigegeben");
    const offenSumme = frei.reduce((s, r) => s + Math.max(0, PS.summen(r).brutto - r.bezahlt), 0);
    let liste = "";
    if (seg === "entwurf") {
      const en = alle.filter((r) => r.status === "entwurf");
      liste = en.length
        ? `<div class="liste">${en.map((r) => `<button class="eintrag" data-a="geh" data-v="rechnung" data-id="${r.id}"><span class="stapel wachse"><span class="zeile"><span class="fett wachse">${e(PS.praxis(r.praxis).kurz)}</span><span class="pille z-entwurf ohne-punkt">Entwurf</span></span><span class="leise">${e(r.art)} · ${PS.mehrzahl(r.auftraege.length, "Auftrag", "Aufträge")}</span><span class="fett zahl">${PS.euro(PS.summen(r).brutto)}</span></span>${I("pfeil")}</button>`).join("")}</div>`
        : `<div class="leer">${I("kreischeck")}<p>Alle Entwürfe sind freigegeben.</p></div>`;
    } else if (seg === "frei") {
      liste = `<div class="liste">${frei
        .slice()
        .sort((a, b) => b.nummer.localeCompare(a.nummer))
        .map((r) => {
          const z = PS.zahlungsstatus(r);
          return `<button class="eintrag" data-a="geh" data-v="rechnung" data-id="${r.id}"><span class="stapel wachse"><span class="zeile"><span class="fett nr wachse">${r.nummer}</span><span class="pille z-${z}">${PS.ZAHLUNG[z]}</span></span><span>${e(PS.praxis(r.praxis).kurz)} · ${PS.datum(r.datum)}</span><span class="fett zahl">${PS.euro(PS.summen(r).brutto)}</span></span>${I("pfeil")}</button>`;
        })
        .join("")}</div>`;
    } else {
      const ueber = frei
        .filter((r) => PS.zahlungsstatus(r) === "ueberfaellig")
        .sort((a, b) => a.faellig.localeCompare(b.faellig));
      liste = ueber.length
        ? `<div class="liste">${ueber.map((r) => `<button class="eintrag" data-a="geh" data-v="rechnung" data-id="${r.id}" style="box-shadow:inset 5px 0 0 var(--rot)"><span class="stapel wachse"><span class="zeile"><span class="fett nr wachse">${r.nummer}</span><span class="fett" style="color:var(--rot)">${PS.tageZwischen(r.faellig, PS.heute())} Tage</span></span><span>${e(PS.praxis(r.praxis).name)}</span><span class="zahl">offen ${PS.euro(PS.summen(r).brutto - r.bezahlt)}</span></span>${I("pfeil")}</button>`).join("")}</div><p class="leise klein">Nur Liste, kein automatischer Mahnversand.</p>`
        : `<div class="leer">${I("kreischeck")}<p>Keine überfälligen Rechnungen.</p></div>`;
    }
    const nEnt = alle.filter((r) => r.status === "entwurf").length;
    const nUeb = frei.filter((r) => PS.zahlungsstatus(r) === "ueberfaellig").length;
    return schale({
      titel: "Rechnungen",
      rechts: glocke(),
      inhalt: `<section class="karte innen"><div class="zeile"><span class="stapel wachse"><span class="leise">Offene Rechnungssumme</span><span class="zahl" style="font-size:1.75rem;font-weight:750;font-family:var(--schrift-titel)">${PS.euro(offenSumme)}</span></span></div><p class="leise klein">Brutto freigegebener Rechnungen minus erfasste Zahlungen</p></section>
      <div class="segment" role="group" aria-label="Ansicht"><button data-a="seg" data-s="entwurf" aria-pressed="${seg === "entwurf"}">Entwürfe${nEnt ? ` (${nEnt})` : ""}</button><button data-a="seg" data-s="frei" aria-pressed="${seg === "frei"}">Freigegeben</button><button data-a="seg" data-s="mahn" aria-pressed="${seg === "mahn"}">Mahnliste${nUeb ? ` (${nUeb})` : ""}</button></div>
      ${liste}`,
    });
  }
  PS.aktionen.seg = (el) => {
    PS.ansicht().seg = el.dataset.s;
    PS.render();
  };
  function rechnungAnsicht(v) {
    const r = PS.z.rechnungen.find((x) => x.id === v.id);
    const p = PS.praxis(r.praxis);
    const s = PS.summen(r);

          <dl class="info-raster"><dt>Rechnungsdatum</dt><dd>${PS.datum(r.datum)}</dd><dt>Fällig am</dt><dd>${PS.datum(r.faellig)}</dd><dt>Bezahlt</dt><dd class="zahl">${PS.euro(r.bezahlt)}</dd>
          <dt>Versand</dt><dd>${r.gesendet ? `${PS.datum(new Date(r.gesendet.zeit))}, ${PS.zeit(r.gesendet.zeit)} Uhr an ${e(r.gesendet.an)}` : "noch nicht gesendet"}</dd></dl>

        ${Object.keys(gruppen)
          .map(
            (g) =>
              `<section class="abschnitt"><h2>${g === "Weitere Positionen" ? g : `Auftrag ${g}`}</h2><div class="liste">${gruppen[g].map((x) => `<div class="eintrag"><span class="stapel wachse"><span class="zeile oben"><span class="wachse">${x.menge} × ${e(x.text)}</span><span class="fett zahl">${PS.euro(x.menge * x.preis)}</span></span><span class="leise klein">${x.nr} · ${PS.euro(x.preis)} je ${e(PS.leistung(x.nr).einheit)} ·${x.steuer} % · <span class="pille ohne-punkt" style="padding:0 8px;font-size:0.8125rem">${x.herkunft}</span></span></span></div>`).join("")}</div></section>`,
          )
          .join("")}
        <section class="karte innen">
          <div class="betrag-zeile"><span>Netto</span><span>${PS.euro(s.netto)}</span></div>
          ${s.steuern.map((x) => `<div class="betrag-zeile leise"><span>Umsatzsteuer ${x.satz} % auf ${PS.euro(x.netto)}</span><span>${PS.euro(x.steuer)}</span></div>`).join("")}
          <div class="betrag-zeile summe"><span>Brutto</span><span>${PS.euro(s.brutto)}</span></div>
        </section>
        <div class="abstand-8">${knoepfe}</div>`,
    });
  }
  PS.aktionen.freigeben = (el) => {
    const r = PS.z.rechnungen.find((x) => x.id === el.dataset.id);
    const nr = PS.nummer("R-", PS.z.zaehler.rechnung + 1);

  PS.aktionen.zahlung = (el) => {

    PS._zahlung = r.id;
    const offen = PS.summen(r).brutto - r.bezahlt;
    PS.blatt(
      `<h2>Zahlungseingang</h2><form class="abstand-8" data-senden="zahlungSpeichern" novalidate>
      <div class="feld"><label for="betrag">Betrag in Euro</label><input class="eingabe zahl" id="betrag" name="betrag" inputmode="decimal" value="${PS.euro(offen).replace(" €", "")}" autofocus></div>
      <p class="leise klein">Noch offen: ${PS.euro(offen)}</p>

      { titel: "Zahlung" },
    );
  };
  PS.aktionen.zahlungSpeichern = (form, d) => {
    const r = PS.z.rechnungen.find((x) => x.id === PS._zahlung);
    const c = PS.leseEuro(d.get("betrag"));
    const f = form.querySelector("#betragFehler");
    const offen = PS.summen(r).brutto - r.bezahlt;
    if (c === null || c <= 0) {
      f.textContent = "Bitte einen Betrag wie 1.234,56 eingeben.";
      f.hidden = false;
      return;

      </section>
      <div class="kacheln">
        <div class="kachel"><span class="wert" style="font-size:1.5rem">${PS.euro(offen)}</span><span class="was">offene Rechnungen</span></div>

    PS.schliesseBlatt(true);

  // ---------- Meine Aufträge (LST-03) ----------
  function auftraege(v) {
    const q = (v.q || "").trim().toLowerCase();
    const liste = meineAuftraege().filter(
      (a) => !q || a.nr.includes(q) || PS.praxis(a.praxis).name.toLowerCase().includes(q),
    );
    const neu = ip().neu;
    return schale({
      titel: "Meine Aufträge",
      unter: `${e(PS.mitarbeiter(ich()).name)} · nach Liefertermin`,
      inhalt: `<div class="zeile" style="gap:12px;flex-wrap:wrap">
          <div class="feld wachse" style="min-width:240px"><label class="vh" for="ipadSuche">Auftrag suchen</label><input class="eingabe" id="ipadSuche" type="search" inputmode="search" placeholder="Auftragsnummer oder Praxis suchen" data-eingabe="ipadSuche" value="${e(v.q || "")}" autocomplete="off"></div>
          <button class="knopf gross" data-a="ipadGeh" data-v="scan">${I("qr")} Laufzettel scannen</button></div>
        <div class="karte" style="overflow:hidden" id="ipadListe">${tabelle(liste, neu)}</div>
        <p class="leise">Neu zugewiesene Aufträge erscheinen hier von selbst, ohne Neuladen. <span class="ampel rot">überfällig</span> &nbsp; <span class="ampel gelb">heute fällig</span></p>`,
    });
  }
  function tabelle(liste, neu) {
    if (!liste.length)
      return `<div class="leer">${I("kreischeck")}<p>Keine offenen Aufträge.</p></div>`;
    return `<div style="overflow-x:auto"><table class="auftrag-tabelle"><thead><tr><th>Termin</th><th>Auftrag</th><th>Praxis</th><th>Arbeitsart</th><th>Status</th></tr></thead><tbody>
      ${liste
        .map((a) => {
          const amp = PS.ampel(a);
          const knopf = (inhalt) =>
            `<button data-a="auftragOeffnen" data-id="${a.id}">${inhalt}</button>`;
          return `<tr class="${amp} ${a.id === neu ? "neu" : ""}"><td>${knopf(PS.terminText(a))}</td><td>${knopf(`<span class="fett nr">${a.nr}</span>${a.id === neu ? ' <span class="pille z-offen ohne-punkt">neu</span>' : ""}`)}</td><td>${knopf(e(PS.praxis(a.praxis).kurz))}</td><td>${knopf(e(a.arbeitsart))}</td><td>${knopf(PS.statusPille(a.status))}</td></tr>`;
        })
        .join("")}
    </tbody></table></div>`;
  }
  PS.aktionen.ipadSuche = (el) => {
    const v = PS.ansicht();
    v.q = el.value;
    const q = v.q.trim().toLowerCase();
    document.getElementById("ipadListe").innerHTML = tabelle(
      meineAuftraege().filter(
        (a) => !q || a.nr.includes(q) || PS.praxis(a.praxis).name.toLowerCase().includes(q),
      ),
      null,
    );
  };
  PS.aktionen.auftragOeffnen = (el) => {
    if (ip().neu === el.dataset.id) ip().neu = null;
    PS.geh("auftrag", { id: el.dataset.id });
  };

  // ---------- Auftrag am iPad ----------
  function eintragText(x) {
    if (x.art === "zeit") return `${PS.dauer(x.minuten)} Arbeitszeit`;
    if (x.art === "leistung") return `${x.menge} × ${e(PS.leistung(x.nr).bezeichnung)}`;
    return `Material: ${e((PS.z.material.find((m) => m.id === x.material) || {}).name || "")}${x.charge ? ` · Charge ${e(x.charge)}` : ""}`;
  }
  function eintragZeile(x, a) {
    const pos = a.positionen.findIndex((p) => p.id === x.position) + 1;
    const aenderbar =
      x.von === ich() && x.tag === PS.heute() && !x.abgerechnet && x.art !== "material";
    const marken = [
      x.nachtraeglich ? '<span class="pille z-entwurf ohne-punkt">nachträglich erfasst</span>' : "",
      !x.gesendet ? '<span class="pille nicht-gesendet ohne-punkt">nicht gesendet</span>' : "",
      x.pruefen
        ? '<span class="pille z-ueberfaellig ohne-punkt">zur Prüfung (über 10 h)</span>'
        : "",
      x.geaendert ? '<span class="pille z-offen ohne-punkt">geändert</span>' : "",
    ].join(" ");
    return `<div class="eintrag" style="align-items:flex-start">
      <span class="stopp-nr" style="width:40px;height:40px">${I(x.art === "zeit" ? "uhr" : x.art === "leistung" ? "check" : "material")}</span>
      <span class="stapel wachse"><span class="fett">${eintragText(x)}</span>
        <span class="leise klein">Position ${pos} · ${PS.tagName(x.tag)}, ${PS.zeit(x.zeit)} Uhr · ${e(x.von)}${x.art === "leistung" ? ` · ${PS.euro(x.menge * x.preis)}` : ""}</span>
        ${marken.trim() ? `<span class="umbruch">${marken}</span>` : ""}</span>
      ${aenderbar ? `<button class="knopf text" data-a="aendern" data-id="${x.id}">${I("stift")} Ändern</button>` : x.von === ich() && x.art !== "material" ? `<span class="leise" title="Ändern nur durch die Verwaltung mit Begründung" aria-label="gesperrt">${I("schloss").replace("<svg", '<svg style="width:22px;height:22px"')}</span>` : ""}
    </div>`;
  }
  function auftragAnsicht(v) {
    const a = PS.auftrag(v.id);
    if (!a || a.techniker !== ich()) {
      return schale({
        titel: "Kein Zugriff",
        zurueck: true,
        inhalt: `<div class="hinweis rot">${I("schloss")}<p>Zugriff verweigert. Dieser Auftrag ist Ihnen nicht zugewiesen.</p></div>`,
      });
    }
    const p = PS.praxis(a.praxis);
    const t = timer();
    const erf = PS.z.erfassungen
      .filter((x) => x.auftrag === a.id)
      .sort((x, y) => y.zeit.localeCompare(x.zeit));
    const wechsel = PS.wechselFuer(a, "techniker", true);
    const posKarte = (x, i) => {
      const l = PS.leistung(x.nr);
      const hier = t && t.position === x.id;
      const ez = erf.filter((y) => y.position === x.id);
      const min = ez.filter((y) => y.art === "zeit").reduce((s, y) => s + y.minuten, 0);
      const nl = ez.filter((y) => y.art === "leistung").reduce((s, y) => s + y.menge, 0);
      return `<article class="karte position">
        <div class="zeile oben"><div class="stapel wachse"><h3>${i + 1}. ${e(l.bezeichnung)}</h3>
          <span class="leise">${[`Menge ${x.menge}`, x.zaehne.length ? `Zähne ${x.zaehne.join(", ")}` : "", x.farbe ? `Farbe ${x.farbe}` : ""].filter(Boolean).join(" · ")}</span></div>
          <span class="leise klein zahl" style="text-align:right">${min ? PS.dauer(min) : "0 min"}<br>${nl} erfasst</span></div>
        ${hier ? `<div class="timer-laeuft"><i></i><span>läuft</span><span data-seit="${t.start}">0:00:00</span></div>` : ""}
        <div class="knoepfe">
          ${hier ? `<button class="knopf gefahr" data-a="timerStop">${I("stop")} Timer stoppen</button>` : `<button class="knopf gruen" data-a="timerStart" data-auftrag="${a.id}" data-pos="${x.id}">${I("play")} Timer starten</button>`}
          <button class="knopf" data-a="leistungNeu" data-auftrag="${a.id}" data-pos="${x.id}">${I("plus")} Leistung</button>
        </div></article>`;
    };
    return schale({
      titel: `Auftrag ${a.nr}`,
      unter: `${e(p.kurz)} · ${e(a.arbeitsart)}`,
      zurueck: true,
      inhalt: `<section class="karte innen"><div class="zeile" style="flex-wrap:wrap;gap:10px 22px">
          <span class="stapel"><span class="leise klein">Praxis</span><span class="fett">${e(p.name)}</span></span>
          <span class="stapel"><span class="leise klein">Behandler</span><span class="fett">${e(a.behandler)}</span></span>
          <span class="stapel"><span class="leise klein">Patient</span><span class="fett">${e(a.patient)}</span></span>
          <span class="stapel"><span class="leise klein">Termin</span>${PS.terminText(a)}</span>
          <span class="stapel"><span class="leise klein">Status</span><span data-testid="status">${PS.statusPille(a.status)}</span></span></div></section>
        <div class="ipad-raster">
          <div class="abstand-8" style="gap:16px">${a.positionen.map(posKarte).join("")}
            <div class="zeile" style="gap:10px;flex-wrap:wrap"><button class="knopf zweit gross" data-a="zeitNachtragen" data-auftrag="${a.id}">${I("uhr")} Zeit nachtragen</button><button class="knopf zweit gross" data-a="materialNeu" data-auftrag="${a.id}">${I("material")} Material und Charge</button></div>
          </div>
          <div class="abstand-8" style="gap:16px">
            <section class="karte innen"><p class="ueberschrift">Status ändern</p>
              ${wechsel.length ? wechsel.map((w, i) => `<button class="knopf gross voll ${w.zweit ? "zweit" : w.nach === "qualitaetskontrolle" ? "gruen" : ""}" data-a="ipadWechsel" data-id="${a.id}" data-i="${i}">${e(w.text)}</button>`).join("") : `<p class="leise">Kein Statuswechsel am iPad möglich.</p>`}
              <p class="leise klein">Nur Wechsel, die für Techniker erlaubt sind.</p></section>
            <section class="abschnitt"><h2>Erfasst <span class="leise klein" style="text-transform:none;letter-spacing:0">${PS.mehrzahl(erf.length, "Eintrag", "Einträge")}</span></h2>
              ${erf.length ? `<div class="liste">${erf.map((x) => eintragZeile(x, a)).join("")}</div>` : `<p class="leise">Noch nichts erfasst.</p>`}
              <p class="leise klein">Eigene Einträge lassen sich am selben Tag ändern. Später ändert nur die Verwaltung, mit Begründung.</p></section>
          </div>
        </div>`,
    });
  }

  // ---------- Timer (LST-05) ----------
  function brauchtNetz() {
    if (!ip().offline) return false;
    PS.meldung("Der Timer braucht WLAN. Ohne Verbindung: „Zeit nachtragen“ nutzen.", "warn");
    return true;
  }
  PS.aktionen.timerStart = (el) => {
    if (brauchtNetz()) return;
    const neu = {
      auftrag: el.dataset.auftrag,
      position: el.dataset.pos,
      start: new Date().toISOString(),
    };
    const t = timer();
    if (t) {
      const alt = PS.auftrag(t.auftrag);
      const pos = alt.positionen.findIndex((p) => p.id === t.position) + 1;
      PS._neuerTimer = neu;
      PS.frage({
        titel: "Es läuft schon ein Timer",
        text: `Auftrag ${alt.nr}, Position ${pos}. Je Techniker läuft nur ein Timer. Den ersten beenden und hier neu starten?`,
        ja: "Ersten beenden und hier starten",
        beiJa: () => {
          stoppeTimer();
          starteTimer(PS._neuerTimer);
        },
      });
      return;
    }
    starteTimer(neu);
  };
  function starteTimer(neu) {
    PS.z.timer[ich()] = neu;
    const a = PS.auftrag(neu.auftrag);
    if (a.status === "zugewiesen") {
      PS.setzeStatus(a, "in_fertigung", ich());
      PS.meldung(`Timer läuft · ${a.nr} ist jetzt „In Fertigung“`);
    } else PS.meldung("Timer läuft");
    PS.render();
  }
  function stoppeTimer() {
    const t = timer();
    if (!t) return 0;
    const sek = Math.floor((Date.now() - Date.parse(t.start)) / 1000);
    const min = Math.max(1, Math.round(sek / 60));
    PS.z.erfassungen.push({
      id: PS.id("e"),
      auftrag: t.auftrag,
      position: t.position,
      art: "zeit",
      minuten: min,
      von: ich(),
      tag: PS.heute(),
      zeit: new Date().toISOString(),
      nachtraeglich: false,
      gesendet: true,
      pruefen: min > 600,
      abgerechnet: false,
    });
    delete PS.z.timer[ich()];
    return min;
  }
  PS.aktionen.timerStop = () => {
    if (brauchtNetz()) return;
    const m = stoppeTimer();
    PS.render();
    PS.meldung(`${PS.dauer(m)} erfasst`);
  };

  // ---------- Leistung erfassen (LST-07, NFR-02: höchstens 4 Berührungen) ----------
  PS.aktionen.leistungNeu = (el) => {
    const a = PS.auftrag(el.dataset.auftrag);
    const pos = a.positionen.find((p) => p.id === el.dataset.pos);
    PS._erf = { auftrag: a.id, position: pos.id, nr: pos.nr, menge: 1, alle: false };
    PS.blatt(leistungBlatt(), { titel: "Leistung erfassen" });
  };
  function leistungBlatt() {
    const s = PS._erf;
    const a = PS.auftrag(s.auftrag);
    const vorschlag = [...new Set(a.positionen.map((p) => p.nr))];
    const nrn = s.alle ? Object.keys(PS.z.katalog) : vorschlag;
    const preis = PS.preisFuer(a.praxis, s.nr);
    const l = PS.leistung(s.nr);
    return `<h2>Leistung erfassen</h2>
      <div class="auswahl-gitter">${nrn.map((nr) => `<button class="auswahl" data-a="erfWahl" data-nr="${nr}" aria-pressed="${nr === s.nr}"><span>${e(PS.leistung(nr).bezeichnung)}</span><span class="leise">${nr}</span></button>`).join("")}</div>
      ${s.alle ? "" : `<button class="knopf text" data-a="erfAlle">Andere Leistung aus dem Katalog …</button>`}
      <div class="feld"><span class="label">Menge (${e(l.einheit)})</span><div class="stepper"><button data-a="erfMenge" data-d="-1" aria-label="Weniger">−</button><output aria-live="polite">${s.menge}</output><button data-a="erfMenge" data-d="1" aria-label="Mehr">+</button></div></div>
      <div class="hinweis">${I("schloss")}<p>Preis aus der Preisliste der Praxis: <b class="zahl">${PS.euro(preis)}</b> je ${e(l.einheit)}. Der Preis lässt sich hier nicht ändern.</p></div>
      ${ip().offline ? `<div class="hinweis gelb">${I("wlanAus")}<p>Ohne WLAN: Der Eintrag wird auf dem iPad gespeichert und später gesendet.</p></div>` : ""}
      <div class="knoepfe"><button class="knopf gross" data-a="erfSpeichern">Speichern</button><button class="knopf gross zweit" data-a="blattZu">Abbrechen</button></div>`;
  }
  function blattNeu(html) {
    const b = document.querySelector("#ebene .blatt");
    if (b) b.innerHTML = `<div class="blatt-griff"></div>${html}`;
  }
  PS.aktionen.erfWahl = (el) => {
    PS._erf.nr = el.dataset.nr;
    blattNeu(leistungBlatt());
  };
  PS.aktionen.erfAlle = () => {
    PS._erf.alle = true;
    blattNeu(leistungBlatt());
  };
  PS.aktionen.erfMenge = (el) => {
    PS._erf.menge = Math.max(1, Math.min(99, PS._erf.menge + Number(el.dataset.d)));
    blattNeu(leistungBlatt());
  };
  PS.aktionen.erfSpeichern = () => {
    const s = PS._erf;
    const a = PS.auftrag(s.auftrag);
    const x = {
      id: PS.id("e"),
      auftrag: a.id,
      position: s.position,
      art: "leistung",
      nr: s.nr,
      menge: s.menge,
      preis: PS.preisFuer(a.praxis, s.nr),
      steuer: PS.leistung(s.nr).steuer,
      von: ich(),
      tag: PS.heute(),
      zeit: new Date().toISOString(),
      nachtraeglich: false,
      gesendet: !ip().offline,
      pruefen: false,
      abgerechnet: false,
    };
    PS.z.erfassungen.push(x);
    PS.schliesseBlatt();
    PS.render();
    PS.meldung(
      ip().offline
        ? "Gespeichert auf dem iPad · wird gesendet, sobald WLAN da ist"
        : `Erfasst: ${s.menge} × ${PS.leistung(s.nr).bezeichnung}`,
      ip().offline ? "info" : "ok",
    );
  };

  // ---------- Zeit nachtragen (LST-06) ----------
  PS.aktionen.zeitNachtragen = (el) => {
    const a = PS.auftrag(el.dataset.auftrag);
    PS._nach = { auftrag: a.id, position: a.positionen[0].id, tag: PS.heute(), minuten: 30 };
    PS.blatt(nachBlatt(), { titel: "Zeit nachtragen" });
  };
  function nachBlatt() {
    const s = PS._nach;
    const a = PS.auftrag(s.auftrag);
    const tage = [0, -1, -2].map((n) => (n === 0 ? PS.heute() : PS.plusArbeitstage(PS.heute(), n)));
    return `<h2>Zeit nachtragen</h2>
      <div class="feld"><span class="label">Position</span><div class="auswahl-gitter">${a.positionen.map((p, i) => `<button class="auswahl" data-a="nachPos" data-id="${p.id}" aria-pressed="${p.id === s.position}"><span>${i + 1}. ${e(PS.leistung(p.nr).bezeichnung)}</span></button>`).join("")}</div></div>
      <div class="feld"><span class="label">Datum</span><div class="chips">${tage.map((t) => `<button class="chip" data-a="nachTag" data-t="${t}" aria-pressed="${t === s.tag}">${PS.tagName(t)} · ${PS.datumKurz(t)}</button>`).join("")}</div></div>
      <div class="feld"><span class="label">Dauer</span><div class="stepper"><button data-a="nachMin" data-d="-15" aria-label="15 Minuten weniger">−</button><output aria-live="polite" style="font-size:1.75rem">${PS.dauer(s.minuten)}</output><button data-a="nachMin" data-d="15" aria-label="15 Minuten mehr">+</button></div></div>
      <p class="leise">Der Eintrag wird als „nachträglich erfasst“ gekennzeichnet.</p>
      <div class="knoepfe"><button class="knopf gross" data-a="nachSpeichern">Speichern</button><button class="knopf gross zweit" data-a="blattZu">Abbrechen</button></div>`;
  }
  PS.aktionen.nachPos = (el) => {
    PS._nach.position = el.dataset.id;
    blattNeu(nachBlatt());
  };
  PS.aktionen.nachTag = (el) => {
    PS._nach.tag = el.dataset.t;
    blattNeu(nachBlatt());
  };
  PS.aktionen.nachMin = (el) => {
    PS._nach.minuten = Math.max(15, Math.min(600, PS._nach.minuten + Number(el.dataset.d)));
    blattNeu(nachBlatt());
  };
  PS.aktionen.nachSpeichern = () => {
    const s = PS._nach;
    PS.z.erfassungen.push({
      id: PS.id("e"),
      auftrag: s.auftrag,
      position: s.position,
      art: "zeit",
      minuten: s.minuten,
      von: ich(),
      tag: s.tag,
      zeit:
        s.tag === PS.heute()
          ? new Date().toISOString()
          : new Date(`${s.tag}T16:00:00`).toISOString(),
      nachtraeglich: true,
      gesendet: !ip().offline,
      pruefen: false,
      abgerechnet: false,
    });
    PS.schliesseBlatt();
    PS.render();
    PS.meldung(
      ip().offline
        ? "Gespeichert auf dem iPad · wird gesendet, sobald WLAN da ist"
        : `${PS.dauer(s.minuten)} nachgetragen`,
      ip().offline ? "info" : "ok",
    );
  };

  // ---------- Material und Charge (LST-08) ----------
  PS.aktionen.materialNeu = (el) => {
    const a = PS.auftrag(el.dataset.auftrag);
    PS._mat = { auftrag: a.id, position: a.positionen[0].id, material: PS.z.material[0].id };
    PS.blatt(matBlatt(), { titel: "Material" });
  };
  function matBlatt() {
    const s = PS._mat;
    const a = PS.auftrag(s.auftrag);
    return `<h2>Material und Charge</h2>
      <div class="feld"><span class="label">Position</span><div class="chips">${a.positionen.map((p, i) => `<button class="chip" data-a="matPos" data-id="${p.id}" aria-pressed="${p.id === s.position}">${i + 1}. ${e(PS.leistung(p.nr).bezeichnung)}</button>`).join("")}</div></div>
      <div class="feld"><span class="label">Material</span><div class="auswahl-gitter">${PS.z.material.map((m) => `<button class="auswahl" data-a="matWahl" data-id="${m.id}" aria-pressed="${m.id === s.material}"><span>${e(m.name)}</span><span class="leise">${e(m.hersteller)}</span></button>`).join("")}</div></div>
      <div class="feld"><label for="charge">Chargennummer</label><input class="eingabe" id="charge" placeholder="z. B. 2026-118" autocomplete="off" value="${e(s.charge || "")}"></div>
      <div class="knoepfe"><button class="knopf gross" data-a="matSpeichern">Speichern</button><button class="knopf gross zweit" data-a="blattZu">Abbrechen</button></div>`;
  }
  function chargeMerken() {
    const c = document.getElementById("charge");
    if (c) PS._mat.charge = c.value;
  }
  PS.aktionen.matPos = (el) => {
    chargeMerken();
    PS._mat.position = el.dataset.id;
    blattNeu(matBlatt());
  };
  PS.aktionen.matWahl = (el) => {
    chargeMerken();
    PS._mat.material = el.dataset.id;
    blattNeu(matBlatt());
  };
  PS.aktionen.matSpeichern = () => {
    chargeMerken();
    const s = PS._mat;
    PS.z.erfassungen.push({
      id: PS.id("e"),
      auftrag: s.auftrag,
      position: s.position,
      art: "material",
      material: s.material,
      charge: (s.charge || "").trim(),
      von: ich(),
      tag: PS.heute(),
      zeit: new Date().toISOString(),
      nachtraeglich: false,
      gesendet: !ip().offline,
      pruefen: false,
      abgerechnet: false,
    });
    PS.schliesseBlatt();
    PS.render();
    PS.meldung("Material erfasst", ip().offline ? "info" : "ok");
  };

  // ---------- Eigene Einträge am selben Tag ändern (LST-10) ----------
  PS.aktionen.aendern = (el) => {
    const x = PS.z.erfassungen.find((y) => y.id === el.dataset.id);
    PS._aend = { id: x.id, wert: x.art === "zeit" ? x.minuten : x.menge };
    PS.blatt(aendBlatt(), { titel: "Eintrag ändern" });
  };
  function aendBlatt() {
    const s = PS._aend;
    const x = PS.z.erfassungen.find((y) => y.id === s.id);
    const zeit = x.art === "zeit";
    return `<h2>Eintrag ändern</h2><p class="leise">Heute erfasst, deshalb dürfen Sie selbst ändern. Alter und neuer Wert stehen im Protokoll.</p>

  // ---------- Statuswechsel am iPad (LST-09) ----------

  // ---------- QR-Scan (LST-04) ----------
  let strom = null,

  function qrBild(text) {
    // Dekoratives Muster (kein echter QR-Code), aus der Auftragsnummer abgeleitet

    const n = 11;
    let r = "";
    for (let y = 0; y < n; y++)
      for (let x = 0; x < n; x++) {
        const ecke = (x < 3 && y < 3) || (x > 7 && y < 3) || (x < 3 && y > 7);
        h = (h * 1103515245 + 12345) >>> 0;
        if (
          ecke
            ? !(x % 2 === 1 && y % 2 === 1 && (x === 1 || x === 9) && (y === 1 || y === 9))
            : h % 3 === 0
        )
          r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
      }
    return `<svg viewBox="0 0 ${n} ${n}" fill="#0e1a27" aria-hidden="true">${r}</svg>`;
  }
  function scan() {

        <div class="abstand-8" style="gap:16px">

              <button class="eintrag laufzettel" data-a="scanTreffer" data-nr="X-0000-99999"><span class="qr">${qrBild("fremd")}</span><span class="stapel wachse"><span class="fett">Fremder Code</span><span class="leise">zeigt die Meldung bei unbekanntem Code</span></span>${I("pfeil")}</button></div></section>

  function oeffneNummer(nr) {
    const roh = String(nr || "").trim();
    const kurz = /^\d{1,5}$/.test(roh) ? `${PS.heute().slice(0, 4)}-${roh.padStart(5, "0")}` : roh;

    const v = document.getElementById("kamera");

            ? Object.entries(proAuftrag)
                .map(([id, xs]) => {
                  const a = PS.auftrag(id);
                  return `<section class="abschnitt"><h2>Auftrag ${a.nr} · ${e(PS.praxis(a.praxis).kurz)}</h2><div class="liste">${xs.map((x) => eintragZeile(x, a)).join("")}</div></section>`;

        }

    });

          : "WLAN wieder da",

    }
  }
  PS.aktionen.wlan = () => setzeOffline(!ip().offline);

  };
  window.addEventListener("offline", () => {

  });
  window.addEventListener("online", () => {
    if (PS.z && PS.z.modus === "ipad") setzeOffline(false);
  });

  // ---------- Modul ----------
  PS.module.ipad = {
    render() {
      if (!ich()) {
        stoppeKamera();

      }

(function () {

  function eintrag(a) {
    const amp = PS.ampel(a);
    const tech = a.techniker || "–";
    return `<div class="display-eintrag ${amp}">
      <span class="nr">${a.nr}</span>
      <span class="rechts" style="grid-row:span 2"><span class="tech">${e(tech)}</span><span class="st">${PS.STATUS[a.status]}</span></span>

    </div>`;
  }
  function spalte(titel, unter, gruppen, max) {
    let n = 0,
      rest = 0,
      html = "";
    for (const [kopf, liste] of gruppen) {
      if (!liste.length) continue;
      if (kopf) html += `<div class="display-tag">${kopf}</div>`;
      for (const a of liste) {
        if (n < max) {
          html += eintrag(a);
          n++;
        } else rest++;
      }
    }
    if (!html)
      html = `<div class="display-eintrag"><span class="praxis" style="color:var(--d-leise)">Keine Liefertermine</span></div>`;
    const gesamt = gruppen.reduce((s, [, l]) => s + l.length, 0);
    return `<section class="display-spalte"><h2>${titel}<span>${unter} · ${gesamt}</span></h2><div class="display-liste">${html}</div>${rest ? `<div class="display-mehr">+ ${rest} weitere</div>` : ""}</section>`;
  }

  PS.module.display = {
    render() {
      const heute = PS.heute();
      const morgen = PS.plusArbeitstage(heute, 1);
      const offen = PS.z.auftraege
        .filter((a) => PS.OFFEN.includes(a.status))
        .sort((a, b) => a.termin.localeCompare(b.termin) || a.nr.localeCompare(b.nr));
      const ueber = offen.filter((a) => a.termin < heute);
      const heuteL = offen.filter((a) => a.termin === heute);
      const morgenL = offen.filter((a) => a.termin === morgen);
      const woche = [];
      for (let i = 2; i <= 5; i++) {
        const t = PS.plusArbeitstage(heute, i);
        woche.push([`${PS.wochentag(t)} ${PS.datumKurz(t)}`, offen.filter((a) => a.termin === t)]);
      }
      const stand = new Date(d().stand);
      if (!letzte) letzte = Date.now();
      return `<div class="display" role="main">
        <header class="display-kopf">
          <span class="logo">${PS.logoZeichen()} Liefertermine</span>
          <span class="display-stand ${d().offline ? "weg" : ""}" id="displayStand"><i></i>${d().offline ? `Keine Verbindung · letzte Aktualisierung ${PS.zeit(stand)} Uhr` : `Aktualisiert ${PS.zeit(stand)} Uhr`}</span>
          <div class="display-uhr"><b data-uhr="min">${PS.zeit(new Date())}</b><span>${PS.wochentag(heute)}, ${PS.datum(heute)}</span></div>
          <button class="icon-knopf" data-a="vollbild" aria-label="Vollbild">${I("vollbild")}</button>
          <button class="icon-knopf" data-a="vorfuehren" aria-label="Vorführen">${I("vorfuehren")}</button>

            "Heute",
            PS.datumKurz(heute),

              [ueber.length ? "Heute fällig" : "", heuteL],
            ],
            9,

          ${spalte("Morgen", `${PS.wochentag(morgen)} ${PS.datumKurz(morgen)}`, [["", morgenL]], 9)}
          ${spalte("Diese Woche", "folgende Tage", woche, 9)}
        </div>

      </div>`;
    },
    nachRender() {
      PS.wachHalten();
    },
    tick() {
      if (Date.now() - letzte < TAKT_MS) return;
      letzte = Date.now();
      if (!d().offline && navigator.onLine !== false) d().stand = new Date().toISOString();
      PS.render();
    },
    vorfuehrExtra() {
      return `<div class="liste"><button class="eintrag" data-a="displayNetz"><span class="stapel wachse"><span class="fett">${d().offline ? "Verbindung wiederherstellen" : "Verbindungsabbruch vorführen"}</span><span class="leise">Das Display zeigt dann „Keine Verbindung“ und die letzte Uhrzeit</span></span>${I("pfeil")}</button></div>`;
    },
  };
  PS.aktionen.vollbild = () => PS.vollbild();
  PS.aktionen.displayNetz = () => {
    d().offline = !d().offline;
    if (!d().offline) d().stand = new Date().toISOString();
    PS.schliesseBlatt(true);
    PS.render();
  };
  window.addEventListener("offline", () => {
    if (PS.z && PS.z.modus === "display") {
      d().offline = true;
      PS.render();
    }
  });
  window.addEventListener("online", () => {
    if (PS.z && PS.z.modus === "display") {
      d().offline = false;
      d().stand = new Date().toISOString();
      PS.render();
    }
  });
})();
